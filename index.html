<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FB Cek Floor</title>
<style>
  :root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1b;--mute:#6b6a65;--line:#e4e2dc;--acc:#0f6b4f;--accbg:#e3f1ec;--bad:#b3261e;--badbg:#fbe7e5;--warn:#9a6700;--warnbg:#fff3d6}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  header{background:#17304f;color:#fff;padding:14px 16px 10px;position:sticky;top:0;z-index:10}
  header .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  header b{font-size:18px} header small{opacity:.75;display:block;font-size:13px}
  header #out{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.55)}
  nav{display:flex;gap:6px;padding:12px 0 2px;overflow-x:auto}
  nav button{border:0;background:none;padding:9px 16px;border-radius:99px;font:inherit;color:rgba(255,255,255,.85);white-space:nowrap;cursor:pointer}
  nav button.on{background:#fff;color:#17304f;font-weight:600}
  .infogrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .info{background:#f3f4f6;border-radius:12px;padding:10px 12px} .info span{display:block;font-size:12px;color:var(--mute)} .info b{font-size:17px}
  .prog{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 6px} .prog b{font-size:20px} .prog span{color:var(--mute);font-size:14px}
  .pbar{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-bottom:12px} .pbar i{display:block;height:100%;background:#1f8a5b}
  button.btn.gold{background:#c99a3a} button.btn.danger{background:#fbe7e5;color:var(--bad)}
  .grp{display:flex;justify-content:space-between;font-weight:700;margin:16px 0 8px} .grp span{color:var(--mute);font-weight:600}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .pt{border-radius:12px;padding:10px;text-align:center;font-size:14px;position:relative;min-height:74px;display:flex;flex-direction:column;justify-content:center;gap:2px}
  .pt small{font-size:12px}
  .pt.todo{border:1px dashed #cbd0d6;color:var(--mute);background:#fafafa}
  .pt.ok{background:#e6f4ec;color:#1f7a50;border:1px solid #bfe3cf;cursor:pointer} .pt.ok b{font-size:16px}
  .pt.sent{background:#eef3fb;color:#2b5aa0;border:1px solid #c9d8f0}
  .pt .warnx{color:#b45309;font-weight:600}
  .pt img{position:absolute;top:6px;right:6px;width:38px;height:38px;border-radius:8px;object-fit:cover}
  .bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;z-index:15}
  .bar .btn{flex:1} .bar .btn.main{flex:1.4}
  main{max-width:960px;margin:0 auto;padding:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
  h2{font-size:16px;margin:0 0 10px} h3{font-size:14px;margin:14px 0 8px;color:var(--mute)}
  button.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:12px 16px;font:inherit;font-weight:600;cursor:pointer}
  button.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
  button.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
  button.btn:disabled{opacity:.5}
  .block{display:block;width:100%}
  input,select,textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff}
  label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
  .row{display:flex;gap:8px;flex-wrap:wrap} .row>*{flex:1;min-width:120px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
  .kpi span{display:block;font-size:12px;color:var(--mute)} .kpi b{font-size:26px}
  .pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
  .ok{background:var(--accbg);color:var(--acc)} .bad{background:var(--badbg);color:var(--bad)} .warn{background:var(--warnbg);color:var(--warn)} .none{background:#eee;color:var(--mute)}
  table{width:100%;border-collapse:collapse;font-size:14px} td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
  th{font-size:12px;color:var(--mute);font-weight:600}
  .bars{display:flex;align-items:flex-end;gap:4px;height:110px;padding-top:6px}
  .bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:10px;color:var(--mute)}
  .bars i{display:block;width:100%;background:var(--acc);border-radius:4px 4px 0 0;min-height:2px}
  .chk{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .tog{display:flex;gap:6px} .tog button{border:1px solid var(--line);background:#fff;padding:6px 12px;border-radius:8px;font:inherit;cursor:pointer}
  .tog button.y.on{background:var(--accbg);color:var(--acc);border-color:var(--acc)} .tog button.n.on{background:var(--badbg);color:var(--bad);border-color:var(--bad)}
  video{width:100%;border-radius:10px;background:#000;max-height:60vh}
  .thumb{width:56px;height:56px;border-radius:8px;object-fit:cover;background:#eee}
  .prev{width:100%;max-height:260px;object-fit:cover;border-radius:10px;margin-top:8px}
  .msg{padding:10px 12px;border-radius:8px;margin:10px 0;font-size:14px}
  .msg.err{background:var(--badbg);color:var(--bad)} .msg.good{background:var(--accbg);color:var(--acc)} .msg.info{background:var(--warnbg);color:var(--warn)}
  .hide{display:none!important}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
  .modal .card{max-width:360px;width:100%;text-align:center;margin:0}
  .qrbox svg{width:100%;height:auto;max-width:260px}
  @media print{header,nav,.noprint{display:none!important} .modal{position:static;background:none} body{background:#fff}}
</style>
</head>
<body>
<header><div class="top"><div><b id="appName">FB Cek Floor</b><small id="who"></small></div><button class="btn sm sec hide" id="out">Keluar</button></div>
<nav id="nav" class="hide"></nav></header>
<main id="main"><div class="card">Memuat…</div></main>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script>
var S = { token: null, me: null, tab: 'scan', admin: null, dash: null, days: 7, stream: null, raf: 0 };

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
// Jika halaman ini dihosting di GitHub Pages / hosting lain, isi dengan URL web app Apps Script (berakhiran /exec).
// Jika dibuka langsung dari URL Apps Script, biarkan saja.
var API_URL = 'https://script.google.com/macros/s/AKfycbxtBRdo7cPj3y3PrAYwrKER2RYZfdkPLl8rDeGgJ-Ezgvqw_P_fnJHbgxNibn_ca6B9Dw/exec';

function transport(fn, args){
  if (window.google && google.script && google.script.run){
    return new Promise(function(res, rej){
      var r = google.script.run.withSuccessHandler(res).withFailureHandler(function(e){
        rej(new Error(e && e.message ? e.message.replace(/^Error:\s*/, '') : String(e)));
      });
      r[fn].apply(r, args);
    });
  }
  if (!/^https:\/\/script\.google\.com\//.test(API_URL))
    return Promise.reject(new Error('API_URL di Index.html belum diisi dengan URL web app (/exec).'));
  return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }) })
    .catch(function(){ throw new Error('Tidak bisa terhubung ke server. Periksa internet dan URL /exec.'); })
    .then(function(r){ return r.json().catch(function(){ throw new Error('Respons server tidak valid. Pastikan deployment aksesnya "Anyone" dan URL-nya benar (/exec).'); }); })
    .then(function(j){ if (!j.ok) throw new Error(j.error || 'Terjadi kesalahan.'); return j.data; });
}

function call(fn){
  var args = Array.prototype.slice.call(arguments, 1);
  if (fn !== 'login' && fn !== 'register') args.unshift(S.token);
  return transport(fn, args).catch(function(e){
    if (e.message.indexOf('SESI_HABIS') >= 0){ showLogin('Sesi berakhir, silakan login lagi.'); throw new Error('Sesi berakhir.'); }
    throw e;
  });
}
function saveTok(t){ try { if (t) sessionStorage.setItem('fbcf_t', t); else sessionStorage.removeItem('fbcf_t'); } catch (e) {} }
function msg(el, text, type){ el.innerHTML = text ? '<div class="msg ' + (type || 'err') + '">' + esc(text) + '</div>' : ''; }

/* ---------- Login & Boot ---------- */
function showLogin(note){
  stopCam(); S.token = null; S.me = null; saveTok(null);
  $('nav').classList.add('hide'); $('out').classList.add('hide'); $('who').textContent = '';
  $('main').innerHTML = '<div class="card" style="max-width:380px;margin:30px auto"><h2>Masuk</h2>' +
    '<label>ID user</label><input id="lu" autocapitalize="none" autocomplete="username">' +
    '<label>PIN (6 digit)</label><input id="lp" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password">' +
    '<button class="btn block" style="margin-top:14px" id="lb">Masuk</button><button class="btn sec block" style="margin-top:8px" id="lr">Belum punya akun? Daftar</button><div id="lmsg">' + (note ? '<div class="msg info">' + esc(note) + '</div>' : '') + '</div></div>';
  function doLogin(){
    var b = $('lb'); b.disabled = true; b.textContent = 'Memeriksa…'; msg($('lmsg'), '');
    call('login', $('lu').value, $('lp').value).then(function(r){ S.token = r.token; saveTok(r.token); start(r); })
      .catch(function(e){ b.disabled = false; b.textContent = 'Masuk'; $('lp').value = ''; msg($('lmsg'), e.message); });
  }
  $('lb').onclick = doLogin;
  $('lr').onclick = function(){ showRegister(); };
  $('lp').onkeydown = function(e){ if (e.key === 'Enter') doLogin(); };
}

function showRegister(){
  $('main').innerHTML = '<div class="card" style="max-width:380px;margin:30px auto"><h2>Daftar akun</h2>' +
    '<label>Nama lengkap</label><input id="rn" maxlength="40">' +
    '<label>ID user (hanya huruf & angka, 3-20 karakter)</label><input id="ru" autocapitalize="none" maxlength="20">' +
    '<label>PIN (6 digit angka)</label><input id="rp" type="password" inputmode="numeric" maxlength="6">' +
    '<label>Ulangi PIN</label><input id="rp2" type="password" inputmode="numeric" maxlength="6">' +
    '<button class="btn block" style="margin-top:14px" id="rb">Kirim pendaftaran</button>' +
    '<button class="btn sec block" style="margin-top:8px" id="rx">Kembali ke login</button><div id="rmsg"></div></div>';
  $('rx').onclick = function(){ showLogin(); };
  $('rb').onclick = function(){
    var m = $('rmsg');
    if ($('rp').value !== $('rp2').value) return msg(m, 'PIN dan ulangi PIN tidak sama.');
    var b = $('rb'); b.disabled = true; b.textContent = 'Mengirim…'; msg(m, '');
    call('register', $('ru').value, $('rn').value, $('rp').value).then(function(){
      $('main').innerHTML = '<div class="card" style="max-width:380px;margin:30px auto"><h2>Pendaftaran terkirim ✔</h2>' +
        '<p>Akun Anda menunggu persetujuan admin. Setelah disetujui, login dengan ID dan PIN yang tadi Anda buat.</p>' +
        '<button class="btn block" id="bk">Ke halaman login</button></div>';
      $('bk').onclick = function(){ showLogin(); };
    }).catch(function(e){ b.disabled = false; b.textContent = 'Kirim pendaftaran'; msg(m, e.message); });
  };
}

function start(r){
  S.me = r.user; if (P.user !== r.user.username) P = newP(r.user.username); $('appName').textContent = r.appName;
  $('who').textContent = r.user.nama + ' · ' + r.user.role; $('out').classList.remove('hide');
  $('out').onclick = function(){ call('logout').catch(function(){}).then(function(){ showLogin(); }); };
  var tabs = [['scan','Patroli']];
  if (r.user.role !== 'petugas') tabs.push(['dash','Dashboard']);
  if (r.user.role === 'admin') tabs.push(['loc','Lokasi & QR'], ['usr','User']);
  $('nav').innerHTML = tabs.map(function(t){ return '<button data-t="' + t[0] + '">' + t[1] + '</button>'; }).join('');
  $('nav').classList.remove('hide');
  $('nav').onclick = function(e){ var t = e.target.getAttribute('data-t'); if (t) go(t); };
  go(r.user.role === 'petugas' ? 'scan' : 'dash');
  if (r.user.role === 'admin') call('adminList').then(function(a){ S.admin = a; badge(); }).catch(function(){});
}
function badge(){
  var n = (S.admin ? S.admin.users : []).filter(function(u){ return u.aktif === 'PENDING'; }).length, b = document.querySelector('#nav [data-t="usr"]');
  if (b) b.textContent = 'User' + (n ? ' (' + n + ' baru)' : '');
}

(function boot(){
  var t = null; try { t = sessionStorage.getItem('fbcf_t'); } catch (e) {}
  if (!t) return showLogin();
  S.token = t;
  call('getMe').then(function(r){ if (r.ok) start(r); else showLogin(); }).catch(function(){ showLogin(); });
})();

function go(t){
  stopCam(); S.tab = t; $('main').onclick = null;
  Array.prototype.forEach.call($('nav').children, function(b){ b.classList.toggle('on', b.getAttribute('data-t') === t); });
  ({ scan: viewScan, dash: viewDash, loc: viewLoc, usr: viewUsr })[t]();
}

/* ---------- Patroli ---------- */
function newP(u){ return { user: u || null, points: [], done: {}, sent: {}, started: null, sending: false, lastQr: '', lastAt: 0, lastTick: 0 }; }
var P = newP();

function norm(s){ return String(s == null ? '' : s).trim().toLowerCase().replace(/\s+/g, ' '); }
function keyOf(t){ return norm(String(t || '').replace(/^\s*FBCF:/i, '')); }
function hhmm(ms){ var d = new Date(ms); return ('0' + d.getHours()).slice(-2) + '.' + ('0' + d.getMinutes()).slice(-2); }
function todayStr(){ return new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }); }
function splitName(n){
  var m = String(n).match(/^(Lantai\s+\d+)\s+(.+)$/i);
  return m ? { group: 'Lantai ' + m[1].replace(/\D/g, ''), label: m[2] } : { group: 'Lainnya', label: String(n) };
}
function groupBy(list){
  var g = {}, order = [];
  list.forEach(function(x){ var s = splitName(x.nama); if (!g[s.group]){ g[s.group] = []; order.push(s.group); } g[s.group].push({ x: x, label: s.label }); });
  order.sort(function(a, b){
    var na = parseInt(a.replace(/\D/g, ''), 10), nb = parseInt(b.replace(/\D/g, ''), 10);
    if (isNaN(na) && isNaN(nb)) return 0; if (isNaN(na)) return 1; if (isNaN(nb)) return -1; return nb - na;
  });
  return order.map(function(k){ return { group: k, items: g[k] }; });
}
window.onbeforeunload = function(e){ if (Object.keys(P.done).length){ e.preventDefault(); e.returnValue = ''; return ''; } };

function loadImg(file, max){
  return new Promise(function(res, rej){
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function(){
      var k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c);
    };
    img.onerror = function(){ rej(new Error('Gambar tidak bisa dibaca')); }; img.src = url;
  });
}

function viewScan(){
  $('main').innerHTML = '<div class="card">Memuat titik patroli…</div>';
  call('getPatrolPoints').then(function(list){
    P.points = list.map(function(n){ return { nama: n, key: norm(n) }; });
    $('main').innerHTML =
      '<div class="card"><div id="pTop"></div>' +
      '<video id="vid" class="hide" playsinline muted></video><canvas id="cv" class="hide"></canvas>' +
      '<button class="btn gold block" id="bCam">Buka Kamera</button><div id="scanMsg"></div></div>' +
      '<div class="card" id="pList"></div><div style="height:90px"></div><div id="pBar"></div>';
    $('bCam').onclick = function(){ S.stream ? stopCam() : startCam(); };
    $('pList').onclick = function(e){
      var t = e.target; while (t && t !== this && !t.getAttribute('data-k')) t = t.parentNode;
      var k = t && t.getAttribute && t.getAttribute('data-k'); if (k && P.done[k]) openPoint(k);
    };
    refreshPatrol();
  }).catch(function(e){ $('main').innerHTML = '<div class="card"><div class="msg err">' + esc(e.message) + '</div></div>'; });
}

function refreshPatrol(){
  if (!$('pTop')) return;
  var total = P.points.length, nd = Object.keys(P.done).length, ns = Object.keys(P.sent).length, scanned = nd + ns;
  $('pTop').innerHTML =
    '<div class="infogrid"><div class="info"><span>Petugas</span><b>' + esc(S.me.nama) + '</b></div><div class="info"><span>Tanggal</span><b>' + todayStr() + '</b></div>' +
    '<div class="info"><span>Mulai</span><b>' + (P.started ? hhmm(P.started) : '–') + '</b></div></div>' +
    '<div class="prog"><b>' + scanned + ' / ' + total + '</b><span>titik sudah di-scan</span></div>' +
    '<div class="pbar"><i style="width:' + (total ? Math.round(scanned / total * 100) : 0) + '%"></i></div>';
  $('bCam').textContent = S.stream ? 'Tutup Kamera' : 'Buka Kamera';
  $('pList').innerHTML = '<h2>Daftar titik cek</h2>' + (total ? groupBy(P.points).map(function(g){
    var okN = g.items.filter(function(i){ return P.done[i.x.key] || P.sent[i.x.key]; }).length;
    return '<div class="grp">' + esc(g.group) + '<span>' + okN + '/' + g.items.length + '</span></div><div class="tiles">' +
      g.items.map(function(i){
        var k = i.x.key, d = P.done[k];
        if (d) return '<div class="pt ok" data-k="' + esc(k) + '">' + (d.thumb ? '<img src="' + esc(d.thumb) + '">' : '') + '<b>✓ ' + esc(i.label) + '</b><small>' + hhmm(d.time) + '</small>' +
          (d.photo ? '<small>' + (d.note ? 'ada catatan' : 'foto siap') + '</small>' : '<small class="warnx">⚠ foto belum diambil</small>') + '</div>';
        if (P.sent[k]) return '<div class="pt sent"><b>✓ ' + esc(i.label) + '</b><small>terkirim ' + hhmm(P.sent[k]) + '</small></div>';
        return '<div class="pt todo"><b style="font-weight:600">' + esc(i.label) + '</b><small>belum</small></div>';
      }).join('') + '</div>';
  }).join('') : '<p style="color:var(--mute)">Belum ada lokasi aktif. Minta admin menambahkannya di tab Lokasi & QR.</p>');
  $('pBar').innerHTML = nd ? '<div class="bar"><button class="btn danger" id="bCancel"' + (P.sending ? ' disabled' : '') + '>Batalkan</button>' +
    '<button class="btn main" id="bSend"' + (P.sending ? ' disabled' : '') + '>' + (P.sending ? 'Mengirim…' : 'Kirim (' + nd + '/' + total + ')') + '</button></div>' : '';
  if (nd){ $('bCancel').onclick = cancelPatrol; $('bSend').onclick = sendAll; }
}

/* kamera: tetap terbuka supaya banyak titik bisa di-scan berurutan */
function startCam(){
  var m = $('scanMsg');
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
    return msg(m, 'Kamera tidak tersedia di browser ini. Buka aplikasi lewat Chrome/Safari dengan alamat https.', 'err');
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }).then(function(st){
    S.stream = st; var v = $('vid'); v.srcObject = st; v.classList.remove('hide'); v.play(); msg(m, 'Arahkan kamera ke QR titik…', 'info'); refreshPatrol();
    var c = $('cv'), ctx = c.getContext('2d');
    (function tick(){
      if (!S.stream) return;
      var now = Date.now();
      if (now - P.lastTick > 120 && v.readyState === v.HAVE_ENOUGH_DATA){
        P.lastTick = now; c.width = v.videoWidth; c.height = v.videoHeight; ctx.drawImage(v, 0, 0);
        var d = ctx.getImageData(0, 0, c.width, c.height), q = jsQR(d.data, d.width, d.height);
        if (q && q.data && (q.data !== P.lastQr || now - P.lastAt > 2500)){ P.lastQr = q.data; P.lastAt = now; onScan(q.data); }
      }
      S.raf = requestAnimationFrame(tick);
    })();
  }).catch(function(){
    msg(m, 'Kamera tidak bisa dibuka. Izinkan akses kamera untuk situs ini di pengaturan browser, lalu coba lagi.', 'err');
  });
}
function stopCam(){
  if (S.raf) cancelAnimationFrame(S.raf); S.raf = 0;
  if (S.stream){ S.stream.getTracks().forEach(function(t){ t.stop(); }); S.stream = null; }
  var v = $('vid'); if (v) v.classList.add('hide');
  if ($('bCam')) $('bCam').textContent = 'Buka Kamera';
}

function onScan(text){
  var k = keyOf(text), m = $('scanMsg'), pt = P.points.filter(function(p){ return p.key === k; })[0];
  if (!pt) return msg(m, 'QR tidak dikenali: "' + String(text).slice(0, 50) + '"', 'err');
  if (P.sent[k]) return msg(m, pt.nama + ' sudah terkirim.', 'info');
  if (P.done[k]) return msg(m, pt.nama + ' sudah di-scan.', 'info');
  var it = { nama: pt.nama, time: Date.now(), note: '', photo: null, thumb: null, lat: '', lng: '' };
  P.done[k] = it; if (!P.started) P.started = it.time;

function cancelPatrol(){

function sendAll(){
  var m = $('scanMsg'), keys = Object.keys(P.done);
  var miss = keys.filter(function(k){ return !P.done[k].photo; });
  if (miss.length){
    msg(m, miss.length + ' titik belum ada foto: ' + miss.slice(0, 4).map(function(k){ return P.done[k].nama; }).join(', ') + (miss.length > 4 ? ', …' : '') + '. Ketuk kotak titik tersebut untuk mengambil foto.', 'err');
    return window.scrollTo(0, 0);
  }
  stopCam(); P.sending = true; refreshPatrol(); msg(m, '');
  var i = 0;
  (function next(){
    if (i >= keys.length){
      P.sending = false;
      var n = Object.keys(P.sent).length;
      $('main').innerHTML = '<div class="card"><h2>Patroli terkirim ✔</h2><p><b>' + n + '</b> titik berhasil dikirim.</p><button class="btn block" id="again">Patroli baru</button></div>';
      return $('again').onclick = function(){ var u = P.user; P = newP(u); viewScan(); };
    }
    var k = keys[i], it = P.done[k];
    if ($('bSend')) $('bSend').textContent = 'Mengirim ' + (i + 1) + '/' + keys.length + '…';
    call('submitCheck', { token: it.nama, note: it.note, photo: it.photo, thumb: it.thumb, lat: it.lat, lng: it.lng, scanned: it.time })
      .then(function(){ P.sent[k] = it.time; delete P.done[k]; i++; next(); })
      .catch(function(e){

        msg($('scanMsg'), i + ' titik terkirim. Gagal di "' + it.nama + '": ' + e.message + ' Ketuk Kirim untuk mencoba lagi.', 'err');

/* ---------- Export PDF (dibuat di browser dengan jsPDF) ---------- */
function pdfClean(s){
  return String(s == null ? '' : s)
    .replace(/[–—−]/g, '-').replace(/[‘’]/g, "'").replace(/[“”]/g, '"')
    .replace(/[•●]/g, '-').replace(/…/g, '...').replace(/\r/g, '')
    .replace(/[^\x20-\xFF\n]/g, '?');
}
function pad2(n){ return ('0' + n).slice(-2); }
function fmtTgl(dt){ return dt.getDate() + ' ' + ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'][dt.getMonth()] + ' ' + dt.getFullYear(); }

function buildPdf(d){
  var J = window.jspdf && window.jspdf.jsPDF;
  if (!J) throw new Error('Pustaka PDF belum termuat. Periksa koneksi internet lalu muat ulang halaman.');
  var doc = new J({ unit: 'mm', format: 'a4' }), W = 210, H = 297, M = 14, CW = W - 2 * M, y = 0;
  function need(h){ if (y + h > H - 16){ doc.addPage(); y = M; } }
  function txt(s, x, yy, o){ doc.text(pdfClean(s), x, yy, o); }
  function heading(s){ need(14); y += 4; doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(23, 48, 79); txt(s, M, y); y += 2; doc.setDrawColor(210); doc.line(M, y, W - M, y); y += 5; }

  var now = new Date(), start = new Date(); start.setDate(start.getDate() - (d.days - 1));
  doc.setFillColor(23, 48, 79); doc.rect(0, 0, W, 24, 'F');
  doc.setTextColor(255); doc.setFont('helvetica', 'bold'); doc.setFontSize(16); txt('FB Cek Floor - Laporan Patroli', M, 11);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
  txt('Periode: ' + fmtTgl(start) + ' - ' + fmtTgl(now) + ' (' + d.days + ' hari)', M, 18);
  y = 31; doc.setTextColor(90); doc.setFontSize(8.5);
  txt('Dibuat ' + fmtTgl(now) + ' ' + pad2(now.getHours()) + '.' + pad2(now.getMinutes()) + (S.me ? ' oleh ' + S.me.nama : ''), M, y); y += 6;

  var k = d.kpi, boxes = [['Laporan hari ini', k.today], ['Titik dicek hari ini', k.locChecked + '/' + k.locTotal], ['Belum dicek hari ini', k.locTotal - k.locChecked], ['Laporan ' + d.days + ' hari', k.period]];
  var bw = (CW - 3 * 4) / 4;
  boxes.forEach(function(b, i){
    var x = M + i * (bw + 4);
    doc.setFillColor(243, 244, 246); doc.roundedRect(x, y, bw, 17, 2, 2, 'F');
    doc.setTextColor(100); doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); txt(b[0], x + 3, y + 5.5);
    doc.setTextColor(20); doc.setFont('helvetica', 'bold'); doc.setFontSize(15); txt(b[1], x + 3, y + 13.5);
  });
  y += 21;

  heading('Jumlah laporan per hari');
  var n = d.trend.length, max = Math.max.apply(null, d.trend.map(function(t){ return t.count; }).concat([1])), ch = 26, slot = CW / n, step = Math.ceil(n / 14);
  need(ch + 12);
  d.trend.forEach(function(t, i){
    var bh = t.count / max * ch, x = M + i * slot + slot * 0.2;
    doc.setFillColor(31, 138, 91); if (bh > 0) doc.rect(x, y + ch - bh, slot * 0.6, bh, 'F');
    doc.setFont('helvetica', 'normal'); doc.setFontSize(6.5);
    if (t.count > 0){ doc.setTextColor(60); txt(t.count, x + slot * 0.3, y + ch - bh - 1, { align: 'center' }); }
    if (i % step === 0){ doc.setTextColor(110); txt(t.tanggal, x + slot * 0.3, y + ch + 4, { align: 'center' }); }
  });
  doc.setDrawColor(200); doc.line(M, y + ch, W - M, y + ch); y += ch + 8;

  heading('Status titik hari ini (' + k.locChecked + '/' + k.locTotal + ' sudah dicek)');
  if (!d.locStatus.length){ doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(120); txt('Belum ada lokasi aktif.', M, y); y += 6; }
  groupBy(d.locStatus).forEach(function(g){
    var okN = g.items.filter(function(i){ return i.x.count > 0; }).length;
    need(16); doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5); doc.setTextColor(30); txt(g.group + '  (' + okN + '/' + g.items.length + ')', M, y); y += 5;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5);
    for (var i = 0; i < g.items.length; i += 2){
      need(6);
      [0, 1].forEach(function(c){
        var it = g.items[i + c]; if (!it) return;
        var x = M + c * (CW / 2), l = it.x;
        if (l.count){ doc.setFillColor(31, 138, 91); doc.circle(x + 1.5, y - 1.2, 1.2, 'F'); } else { doc.setDrawColor(160); doc.circle(x + 1.5, y - 1.2, 1.2, 'S'); }
        doc.setTextColor(30); txt(it.label, x + 5, y);
        doc.setTextColor(l.count ? 31 : 140, l.count ? 138 : 140, l.count ? 91 : 140);
        txt(l.count ? l.waktu + ' ' + l.petugas : 'belum', x + CW / 2 - 4, y, { align: 'right' });
      });
      y += 5.5;
    }
    y += 2;
  });

  heading('Laporan terbaru (' + d.recent.length + ')');
  if (!d.recent.length){ doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(120); txt('Belum ada laporan.', M, y); y += 6; }
  d.recent.forEach(function(r){
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5);
    var lines = r.catatan ? doc.splitTextToSize(pdfClean(r.catatan), CW - 20) : [], rowH = Math.max(17, 11 + lines.length * 4 + 3);
    need(rowH);
    if (r.thumb){ try { doc.addImage(r.thumb, 'JPEG', M, y - 3, 14, 14); } catch (e) { doc.setFillColor(235); doc.rect(M, y - 3, 14, 14, 'F'); } }
    else { doc.setFillColor(235); doc.rect(M, y - 3, 14, 14, 'F'); }
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5); doc.setTextColor(25); txt(r.lokasi, M + 18, y + 1);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(110); txt(r.waktu + '  -  ' + r.petugas, M + 18, y + 5.5);
    if (lines.length){ doc.setFontSize(8.5); doc.setTextColor(50); doc.text(lines, M + 18, y + 10); }
    y += rowH; doc.setDrawColor(230); doc.line(M, y - 3, W - M, y - 3);
  });

  var pages = doc.getNumberOfPages();
  for (var p = 1; p <= pages; p++){
    doc.setPage(p); doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(150);
    txt('FB Cek Floor  -  hal. ' + p + ' / ' + pages, W / 2, H - 8, { align: 'center' });
  }
  return doc;
}

function exportPdf(){
  var m = $('pdfMsg'), b = $('pdf');
  if (!S.dash) return msg(m, 'Data dashboard belum dimuat.', 'err');
  b.disabled = true; b.textContent = 'Membuat PDF…'; msg(m, '');
  setTimeout(function(){
    try {
      var t = new Date(), doc = buildPdf(S.dash);
      doc.save('Laporan-Patroli-' + t.getFullYear() + pad2(t.getMonth() + 1) + pad2(t.getDate()) + '.pdf');
      msg(m, 'PDF dibuat. Cek folder Unduhan.', 'good');

function dashTiles(list){

    var okN = g.items.filter(function(i){ return i.x.count > 0; }).length;
    return '<div class="grp">' + esc(g.group) + '<span>' + okN + '/' + g.items.length + '</span></div><div class="tiles">' +
      g.items.map(function(i){
        var l = i.x;
        return l.count ? '<div class="pt" style="background:#e6f4ec;color:#1f7a50;border:1px solid #bfe3cf"><b>✓ ' + esc(i.label) + '</b><small>' + esc(l.waktu) + ' · ' + esc(l.petugas) + (l.count > 1 ? ' · ' + l.count + 'x' : '') + '</small></div>'
          : '<div class="pt todo"><b style="font-weight:600">' + esc(i.label) + '</b><small>belum</small></div>';
      }).join('') + '</div>';
  }).join('');
}

    } else {
      var p = { username: u.username, nama: u.nama, role: u.role, aktif: u.aktif };
      if (a === 'pin'){ var np = prompt('PIN baru untuk ' + u.username + ' (6 digit):'); if (!np) return; p.pin = np; }
      else p.aktif = u.aktif === 'YES' ? 'NO' : 'YES';
      req = call('adminSaveUser', p);
    }
    req.then(function(r){ S.admin = r; renderUsr(); }).catch(function(er){ alert(er.message); });
  };
}
</script>
</body>
</html>

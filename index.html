<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FB Cek Floor</title>
<style>
  :root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1b;--mute:#6b6a65;--line:#e4e2dc;--acc:#0f6b4f;--accbg:#e3f1ec;--bad:#b3261e;--badbg:#fbe7e5;--warn:#9a6700;--warnbg:#fff3d6}
  *{box-sizing:border-box}
  html,body{overscroll-behavior-y:contain}   /* tarik layar ke bawah tidak me-reload halaman */
  body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  header{background:#17304f;color:#fff;padding:14px 16px 10px;position:sticky;top:0;z-index:10}
  header .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  header b{font-size:18px} header small{opacity:.75;display:block;font-size:13px}
  header #out,header #bell{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.55)}
  .topr{display:flex;gap:8px;align-items:center}
  .cheer{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:rgba(10,20,35,.45);animation:chIn .2s ease-out}
  .cheer .box{background:#fff;border-radius:20px;padding:22px 26px;text-align:center;max-width:300px;box-shadow:0 12px 40px rgba(0,0,0,.35);animation:chPop .35s cubic-bezier(.2,1.4,.4,1)}
  .cheer .em{font-size:44px;line-height:1.1} .cheer .tx{font-size:22px;font-weight:800;color:#17304f;margin-top:8px} .cheer .pc{color:var(--mute);font-size:13px;margin-top:4px}
  @keyframes chIn{from{opacity:0}to{opacity:1}} @keyframes chPop{from{transform:scale(.6)}to{transform:scale(1)}}
  @media (prefers-reduced-motion:reduce){.cheer,.cheer .box{animation:none}}
  .toasts{position:fixed;top:10px;left:10px;right:10px;max-width:420px;margin-left:auto;z-index:60}
  .toast{background:#17304f;color:#fff;border-radius:12px;padding:12px 14px;margin-bottom:8px;box-shadow:0 6px 20px rgba(0,0,0,.3);display:flex;gap:10px;align-items:center;cursor:pointer}
  .toast small{opacity:.8}
  .track{position:relative;height:50px;border-bottom:2px dashed #cbd0d6;margin-top:6px}
  .track .wkr{position:absolute;bottom:2px;width:34px;height:46px;transition:left 1.2s linear}
  .track .flag{position:absolute;right:0;bottom:4px;font-size:18px}
  .lane{margin-bottom:14px} .lmeta{display:flex;justify-content:space-between;gap:8px;font-size:14px;flex-wrap:wrap} .lmeta span{color:var(--mute);font-size:13px}
  .wk .leg,.wk .arm,.wk .bob{animation-iteration-count:infinite;animation-timing-function:ease-in-out;animation-duration:.6s}
  .wk .l1,.wk .a2{animation-name:swingA} .wk .l2,.wk .a1{animation-name:swingB}
  .wk .bob{animation-name:bobY;animation-duration:.3s}
  @keyframes swingA{0%,100%{transform:rotate(28deg)}50%{transform:rotate(-28deg)}}
  @keyframes swingB{0%,100%{transform:rotate(-28deg)}50%{transform:rotate(28deg)}}
  @keyframes bobY{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
  .idle .wk *{animation-play-state:paused!important}
  @media (prefers-reduced-motion:reduce){.wk *{animation:none!important}}
  nav{display:flex;gap:6px;padding:12px 0 2px;overflow-x:auto}
  nav button{border:0;background:none;padding:9px 16px;border-radius:99px;font:inherit;color:rgba(255,255,255,.85);white-space:nowrap;cursor:pointer}
  nav button.on{background:#fff;color:#17304f;font-weight:600}
  .infogrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .info{background:#f3f4f6;border-radius:12px;padding:10px 12px} .info span{display:block;font-size:12px;color:var(--mute)} .info b{font-size:17px}
  .prog{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 6px} .prog b{font-size:20px} .prog span{color:var(--mute);font-size:14px}
  .pbar{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-bottom:12px} .pbar i{display:block;height:100%;background:#1f8a5b}
  button.btn.gold{background:#c99a3a} button.btn.danger{background:#fbe7e5;color:var(--bad)}
  .grp{display:flex;justify-content:space-between;font-weight:700;margin:16px 0 8px} .grp span{color:var(--mute);font-weight:600}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .pt{border-radius:12px;padding:10px;text-align:center;font-size:14px;position:relative;min-height:74px;display:flex;flex-direction:column;justify-content:center;gap:2px}
  .pt small{font-size:12px}
  .pt.todo{border:1px dashed #cbd0d6;color:var(--mute);background:#fafafa}
  .pt.ok{background:#e6f4ec;color:#1f7a50;border:1px solid #bfe3cf;cursor:pointer} .pt.ok b{font-size:16px}
  .pt.sent{background:#eef3fb;color:#2b5aa0;border:1px solid #c9d8f0}
  .pt .warnx{color:#b45309;font-weight:600}
  .pt img{position:absolute;top:6px;right:6px;width:38px;height:38px;border-radius:8px;object-fit:cover}
  .bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;z-index:15}
  .bar .btn{flex:1} .bar .btn.main{flex:1.4}
  main{max-width:960px;margin:0 auto;padding:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
  h2{font-size:16px;margin:0 0 10px} h3{font-size:14px;margin:14px 0 8px;color:var(--mute)}
  button.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:12px 16px;font:inherit;font-weight:600;cursor:pointer}
  button.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
  button.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
  button.btn:disabled{opacity:.5}
  .block{display:block;width:100%}
  input,select,textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff}
  label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
  .row{display:flex;gap:8px;flex-wrap:wrap} .row>*{flex:1;min-width:120px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
  .kpi span{display:block;font-size:12px;color:var(--mute)} .kpi b{font-size:26px}
  .pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
  .ok{background:var(--accbg);color:var(--acc)} .bad{background:var(--badbg);color:var(--bad)} .warn{background:var(--warnbg);color:var(--warn)} .none{background:#eee;color:var(--mute)}
  table{width:100%;border-collapse:collapse;font-size:14px} td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
  th{font-size:12px;color:var(--mute);font-weight:600}
  .bars{display:flex;align-items:flex-end;gap:4px;height:110px;padding-top:6px}
  .bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:10px;color:var(--mute)}
  .bars i{display:block;width:100%;background:var(--acc);border-radius:4px 4px 0 0;min-height:2px}
  .chk{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .tog{display:flex;gap:6px} .tog button{border:1px solid var(--line);background:#fff;padding:6px 12px;border-radius:8px;font:inherit;cursor:pointer}
  .tog button.y.on{background:var(--accbg);color:var(--acc);border-color:var(--acc)} .tog button.n.on{background:var(--badbg);color:var(--bad);border-color:var(--bad)}
  video{width:100%;border-radius:10px;background:#000;max-height:60vh}
  .thumb{width:56px;height:56px;border-radius:8px;object-fit:cover;background:#eee}
  .prev{width:100%;max-height:260px;object-fit:cover;border-radius:10px;margin-top:8px}
  .msg{padding:10px 12px;border-radius:8px;margin:10px 0;font-size:14px}
  .msg.err{background:var(--badbg);color:var(--bad)} .msg.good{background:var(--accbg);color:var(--acc)} .msg.info{background:var(--warnbg);color:var(--warn)}
  .hide{display:none!important}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
  .modal .card{max-width:360px;width:100%;text-align:center;margin:0}
  .qrbox svg{width:100%;height:auto;max-width:260px}
  @media print{header,nav,.noprint{display:none!important} .modal{position:static;background:none} body{background:#fff}}
</style>
</head>
<body>
<header><div class="top"><div><b id="appName">FB Cek Floor</b><small id="who"></small></div><div class="topr"><button class="btn sm sec hide" id="bell" title="Suara &amp; notifikasi">🔔</button><button class="btn sm sec hide" id="out">Keluar</button></div></div>
<nav id="nav" class="hide"></nav></header>
<main id="main"><div class="card">Memuat…</div></main>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script>
var S = { token: null, me: null, tab: 'scan', admin: null, dash: null, days: 7, stream: null, raf: 0 };

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
// Jika halaman ini dihosting di GitHub Pages / hosting lain, isi dengan URL web app Apps Script (berakhiran /exec).
// Jika dibuka langsung dari URL Apps Script, biarkan saja.
var API_URL = 'https://script.google.com/macros/s/AKfycbxtBRdo7cPj3y3PrAYwrKER2RYZfdkPLl8rDeGgJ-Ezgvqw_P_fnJHbgxNibn_ca6B9Dw/exec';

function transport(fn, args){
  if (window.google && google.script && google.script.run){
    return new Promise(function(res, rej){
      var r = google.script.run.withSuccessHandler(res).withFailureHandler(function(e){
        rej(new Error(e && e.message ? e.message.replace(/^Error:\s*/, '') : String(e)));
      });
      r[fn].apply(r, args);
    });
  }
  if (!/^https:\/\/script\.google\.com\//.test(API_URL))
    return Promise.reject(new Error('API_URL di Index.html belum diisi dengan URL web app (/exec).'));
  return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }) })
    .catch(function(){ throw new Error('Tidak bisa terhubung ke server. Periksa internet dan URL /exec.'); })
    .then(function(r){ return r.json().catch(function(){ throw new Error('Respons server tidak valid. Pastikan deployment aksesnya "Anyone" dan URL-nya benar (/exec).'); }); })
    .then(function(j){ if (!j.ok) throw new Error(j.error || 'Terjadi kesalahan.'); return j.data; });
}

function call(fn){
  var args = Array.prototype.slice.call(arguments, 1);
  if (fn !== 'login' && fn !== 'register') args.unshift(S.token);
  return transport(fn, args).catch(function(e){
    if (e.message.indexOf('SESI_HABIS') >= 0){ showLogin('Sesi berakhir, silakan login lagi.'); throw new Error('Sesi berakhir.'); }
    throw e;
  });
}
function saveTok(t){ try { if (t) sessionStorage.setItem('fbcf_t', t); else sessionStorage.removeItem('fbcf_t'); } catch (e) {} }
function msg(el, text, type){ el.innerHTML = text ? '<div class="msg ' + (type || 'err') + '">' + esc(text) + '</div>' : ''; }

/* ---------- Login & Boot ---------- */
function showLogin(note){
  stopCam(); S.token = null; S.me = null; saveTok(null);
  stopWatch(); stopLive(); stopPing(); $('nav').classList.add('hide'); $('out').classList.add('hide'); $('bell').classList.add('hide'); $('who').textContent = '';
  $('main').innerHTML = '<div class="card" style="max-width:380px;margin:30px auto"><h2>Masuk</h2>' +
    '<label>ID user</label><input id="lu" autocapitalize="none" autocomplete="username">' +
    '<label>PIN (6 digit)</label><input id="lp" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password">' +
    '<button class="btn block" style="margin-top:14px" id="lb">Masuk</button><button class="btn sec block" style="margin-top:8px" id="lr">Belum punya akun? Daftar</button><div id="lmsg">' + (note ? '<div class="msg info">' + esc(note) + '</div>' : '') + '</div></div>';
  function doLogin(){
    var b = $('lb'); b.disabled = true; b.textContent = 'Memeriksa…'; msg($('lmsg'), '');
    call('login', $('lu').value, $('lp').value).then(function(r){ S.token = r.token; saveTok(r.token); start(r); })
      .catch(function(e){ b.disabled = false; b.textContent = 'Masuk'; $('lp').value = ''; msg($('lmsg'), e.message); });
  }
  $('lb').onclick = doLogin;
  $('lr').onclick = function(){ showRegister(); };
  $('lp').onkeydown = function(e){ if (e.key === 'Enter') doLogin(); };
}

function showRegister(){
  $('main').innerHTML = '<div class="card" style="max-width:380px;margin:30px auto"><h2>Daftar akun</h2>' +
    '<label>Nama lengkap</label><input id="rn" maxlength="40">' +
    '<label>ID user (hanya huruf & angka, 3-20 karakter)</label><input id="ru" autocapitalize="none" maxlength="20">' +
    '<label>PIN (6 digit angka)</label><input id="rp" type="password" inputmode="numeric" maxlength="6">' +
    '<label>Ulangi PIN</label><input id="rp2" type="password" inputmode="numeric" maxlength="6">' +
    '<button class="btn block" style="margin-top:14px" id="rb">Kirim pendaftaran</button>' +
    '<button class="btn sec block" style="margin-top:8px" id="rx">Kembali ke login</button><div id="rmsg"></div></div>';
  $('rx').onclick = function(){ showLogin(); };
  $('rb').onclick = function(){
    var m = $('rmsg');
    if ($('rp').value !== $('rp2').value) return msg(m, 'PIN dan ulangi PIN tidak sama.');
    var b = $('rb'); b.disabled = true; b.textContent = 'Mengirim…'; msg(m, '');
    call('register', $('ru').value, $('rn').value, $('rp').value).then(function(){
      $('main').innerHTML = '<div class="card" style="max-width:380px;margin:30px auto"><h2>Pendaftaran terkirim ✔</h2>' +
        '<p>Akun Anda menunggu persetujuan admin. Setelah disetujui, login dengan ID dan PIN yang tadi Anda buat.</p>' +
        '<button class="btn block" id="bk">Ke halaman login</button></div>';
      $('bk').onclick = function(){ showLogin(); };
    }).catch(function(e){ b.disabled = false; b.textContent = 'Kirim pendaftaran'; msg(m, e.message); });
  };
}

function start(r){
  S.me = r.user; if (P.user !== r.user.username) P = newP(r.user.username); loadP(); $('appName').textContent = r.appName;
  $('who').textContent = r.user.nama + ' · ' + r.user.role; $('out').classList.remove('hide');
  $('out').onclick = function(){ call('logout').catch(function(){}).then(function(){ showLogin(); }); };
  var tabs = [['scan','Patroli']];
  if (r.user.role !== 'petugas') tabs.push(['dash','Dashboard']);
  if (r.user.role === 'admin') tabs.push(['loc','Lokasi & QR'], ['usr','User']);
  $('nav').innerHTML = tabs.map(function(t){ return '<button data-t="' + t[0] + '">' + t[1] + '</button>'; }).join('');
  $('nav').classList.remove('hide');
  $('nav').onclick = function(e){ var t = e.target.getAttribute('data-t'); if (t) go(t); };
  go(r.user.role === 'petugas' || P.restored ? 'scan' : 'dash');
  if (P.restored){ pingNow(); startPing(); }
  if (r.user.role === 'admin'){ call('adminList').then(function(a){ S.admin = a; badge(); }).catch(function(){}); startWatch(); } else stopWatch();
}
/* ---------- Notifikasi admin: bunyi + banner + notifikasi sistem ---------- */
var DL = { timer: 0 }, PG = { timer: 0 };   // timer kartu 'Sedang patroli' dan sinyal patroli
var W = { timer: 0, since: null, busy: false, ctx: null };
function lsGet(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); } catch (e) {} }
function sndOn(){ return lsGet('fbcf_snd') !== '0'; }
function unlockAudio(){
  try {
    var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    if (!W.ctx) W.ctx = new AC(); if (W.ctx.state === 'suspended') W.ctx.resume();
  } catch (e) {}
}
document.addEventListener('pointerdown', unlockAudio, true);
document.addEventListener('keydown', unlockAudio, true);

function beep(kind){
  if (!sndOn()) return;
  try {
    unlockAudio(); var c = W.ctx; if (!c) return;
    var notes = kind === 'daftar' ? [660, 880, 1175] : [880, 1175], t = c.currentTime;
    notes.forEach(function(f, i){
      var o = c.createOscillator(), g = c.createGain(), s = t + i * 0.18;
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(0.3, s + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, s + 0.16);
      o.connect(g); g.connect(c.destination); o.start(s); o.stop(s + 0.18);
    });
  } catch (e) {}
  if (navigator.vibrate) navigator.vibrate(kind === 'daftar' ? [120, 60, 120, 60, 120] : [150, 80, 150]);
}

function toast(ev){
  var box = $('toasts');
  if (!box){ box = document.createElement('div'); box.id = 'toasts'; box.className = 'toasts'; document.body.appendChild(box); }
  var t = document.createElement('div'); t.className = 'toast';
  t.innerHTML = '<span style="font-size:22px">' + (ev.tipe === 'daftar' ? '🆕' : '✅') + '</span><div><b>' + (ev.tipe === 'daftar' ? 'Pendaftar baru' : 'Patroli selesai') + '</b><br><small>' + esc(ev.pesan) + ' · ' + esc(ev.jam) + '</small></div>';
  t.onclick = function(){ t.remove(); go(ev.tipe === 'daftar' ? 'usr' : 'dash'); };
  box.appendChild(t); setTimeout(function(){ if (t.parentNode) t.remove(); }, 12000);
}
function osNotify(ev){
  try {
    if (window.Notification && Notification.permission === 'granted' && document.hidden)
      new Notification(ev.tipe === 'daftar' ? 'Pendaftar baru' : 'Patroli selesai', { body: ev.pesan, tag: 'fbcf-' + ev.id });
  } catch (e) {}
}

function pollEvents(){
  if (W.busy || !S.me || S.me.role !== 'admin' || !S.token) return;
  W.busy = true;
  call('getAdminEvents', W.since).then(function(r){
    W.busy = false;
    if (W.since === null || r.latest < W.since){ W.since = r.latest; lsSet('fbcf_since_' + S.me.username, String(r.latest)); }
    else if (r.events.length){
      W.since = r.latest; lsSet('fbcf_since_' + S.me.username, String(r.latest));
      var evs = r.events.filter(function(e){ return e.oleh !== S.me.username; });
      if (evs.length){
        beep(evs.some(function(e){ return e.tipe === 'daftar'; }) ? 'daftar' : 'patroli');
        evs.slice(-3).forEach(function(e){ toast(e); });
        osNotify(evs[evs.length - 1]);
        if (S.tab === 'dash' && evs.some(function(e){ return e.tipe === 'patroli'; })) viewDash();
      }
    }
    var cur = S.admin ? S.admin.users.filter(function(u){ return u.aktif === 'PENDING'; }).length : -1;
    if (r.pending !== cur) call('adminList').then(function(a){ S.admin = a; badge(); }).catch(function(){});
  }).catch(function(){ W.busy = false; });
}
function startWatch(){
  stopWatch();
  var s = lsGet('fbcf_since_' + S.me.username); W.since = s === null ? null : Number(s);
  var b = $('bell'); b.classList.remove('hide'); b.textContent = sndOn() ? '🔔' : '🔕';
  b.onclick = function(){
    var on = !sndOn(); lsSet('fbcf_snd', on ? '1' : '0'); b.textContent = on ? '🔔' : '🔕';
    if (on){
      unlockAudio(); beep('patroli');
      try { if (window.Notification && Notification.permission === 'default') Notification.requestPermission(); } catch (e) {}
    }
  };
  pollEvents(); W.timer = setInterval(pollEvents, 20000);
}
function stopWatch(){ if (W.timer) clearInterval(W.timer); W.timer = 0; W.busy = false; }
document.addEventListener('visibilitychange', function(){ if (!document.hidden) pollEvents(); });

function badge(){
  var n = (S.admin ? S.admin.users : []).filter(function(u){ return u.aktif === 'PENDING'; }).length, b = document.querySelector('#nav [data-t="usr"]');
  if (b) b.textContent = 'User' + (n ? ' (' + n + ' baru)' : '');
}

(function boot(){
  var t = null; try { t = sessionStorage.getItem('fbcf_t'); } catch (e) {}
  if (!t) return showLogin();
  S.token = t;
  call('getMe').then(function(r){ if (r.ok) start(r); else showLogin(); }).catch(function(){ showLogin(); });
})();

function go(t){
  stopCam(); stopLive(); S.tab = t; $('main').onclick = null;
  Array.prototype.forEach.call($('nav').children, function(b){ b.classList.toggle('on', b.getAttribute('data-t') === t); });
  ({ scan: viewScan, dash: viewDash, loc: viewLoc, usr: viewUsr })[t]();
}

/* ---------- Patroli ---------- */
function newP(u){ return { user: u || null, points: [], done: {}, sent: {}, started: null, sending: false, lastQr: '', lastAt: 0, lastTick: 0, cheer: 0 }; }
var P = newP();

/* Pop up semangat saat progres patroli mencapai 30%, 60%, 90% (masing-masing sekali per patroli) */
var CHEERS = [{ at: 90, em: '💪', tx: 'Kamu Bisa!' }, { at: 60, em: '🔥', tx: 'Lebih Semangat Lagi!' }, { at: 30, em: '🚶', tx: 'Ayo Semangat!' }];
function showCheer(c, pct){
  var old = $('cheer'); if (old) old.remove();
  var el = document.createElement('div'); el.id = 'cheer'; el.className = 'cheer';

  var close = function(){ if (el.parentNode) el.remove(); };

function checkCheer(){
  var total = P.points.length; if (!total) return;

function norm(s){ return String(s == null ? '' : s).trim().toLowerCase().replace(/\s+/g, ' '); }
function keyOf(t){ return norm(String(t || '').replace(/^\s*FBCF:/i, '')); }
function hhmm(ms){ var d = new Date(ms); return ('0' + d.getHours()).slice(-2) + '.' + ('0' + d.getMinutes()).slice(-2); }
function todayStr(){ return new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }); }
function splitName(n){
  var m = String(n).match(/^(Lantai\s+\d+)\s+(.+)$/i);
  return m ? { group: 'Lantai ' + m[1].replace(/\D/g, ''), label: m[2] } : { group: 'Lainnya', label: String(n) };
}
function groupBy(list){
  var g = {}, order = [];
  list.forEach(function(x){ var s = splitName(x.nama); if (!g[s.group]){ g[s.group] = []; order.push(s.group); } g[s.group].push({ x: x, label: s.label }); });
  order.sort(function(a, b){
    var na = parseInt(a.replace(/\D/g, ''), 10), nb = parseInt(b.replace(/\D/g, ''), 10);
    if (isNaN(na) && isNaN(nb)) return 0; if (isNaN(na)) return 1; if (isNaN(nb)) return -1; return nb - na;
  });
  return order.map(function(k){ return { group: k, items: g[k] }; });
}
/* ---------- Simpan posisi patroli di HP (bertahan saat Back / tab tertutup / refresh) ---------- */
var PKEY = function(u){ return 'fbcf_patrol_' + u; }, PMAX_AGE = 18 * 3600 * 1000, saveT = 0;
function pActive(){ return Object.keys(P.done).length + Object.keys(P.sent).length > 0; }
function clearSaved(){ clearTimeout(saveT); try { if (P.user) localStorage.removeItem(PKEY(P.user)); } catch (e) {} }
function saveP(){
  clearTimeout(saveT);
  if (!P.user) return;
  if (!pActive() || P.finished) return clearSaved();
  var snap = function(withPhoto){
    var d = {};
    Object.keys(P.done).forEach(function(k){ var it = P.done[k]; d[k] = { nama: it.nama, time: it.time, note: it.note, lat: it.lat, lng: it.lng, photo: withPhoto ? it.photo : null, thumb: withPhoto ? it.thumb : null }; });
    return JSON.stringify({ ts: Date.now(), started: P.started, cheer: P.cheer, done: d, sent: P.sent });
  };
  try { localStorage.setItem(PKEY(P.user), snap(true)); }
  catch (e) { try { localStorage.setItem(PKEY(P.user), snap(false)); P.photoLost = true; } catch (e2) {} } // penyimpanan penuh: simpan tanpa foto
}
function saveSoon(){ clearTimeout(saveT); saveT = setTimeout(saveP, 400); }
function loadP(){
  if (!P.user || pActive()) return false;
  try {
    var d = JSON.parse(localStorage.getItem(PKEY(P.user)) || 'null');
    if (!d || Date.now() - d.ts > PMAX_AGE) { clearSaved(); return false; }
    P.done = d.done || {}; P.sent = d.sent || {}; P.started = d.started || null; P.cheer = d.cheer || 0;
    P.restored = true; return pActive();
  } catch (e) { return false; }
}

document.addEventListener('visibilitychange', function(){ if (document.hidden) saveP(); });
window.addEventListener('popstate', function(){      /* tombol Back saat patroli berjalan: tetap di aplikasi */

/* Konfirmasi di dalam aplikasi (bukan dialog bawaan browser). Tombol utama = "Batal"/lanjut, jadi ketukan tidak sengaja tidak menghapus apa pun. */

function loadImg(file, max){
  return new Promise(function(res, rej){
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function(){
      var k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c);
    };
    img.onerror = function(){ rej(new Error('Gambar tidak bisa dibaca')); }; img.src = url;
  });
}

/* kamera: tetap terbuka supaya banyak titik bisa di-scan berurutan */
function startCam(){
  var m = $('scanMsg');
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
    return msg(m, 'Kamera tidak tersedia di browser ini. Buka aplikasi lewat Chrome/Safari dengan alamat https.', 'err');
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }).then(function(st){
    S.stream = st; var v = $('vid'); v.srcObject = st; v.classList.remove('hide'); v.play(); msg(m, 'Arahkan kamera ke QR titik…', 'info'); refreshPatrol();
    var c = $('cv'), ctx = c.getContext('2d');
    (function tick(){
      if (!S.stream) return;
      var now = Date.now();
      if (now - P.lastTick > 120 && v.readyState === v.HAVE_ENOUGH_DATA){
        P.lastTick = now; c.width = v.videoWidth; c.height = v.videoHeight; ctx.drawImage(v, 0, 0);
        var d = ctx.getImageData(0, 0, c.width, c.height), q = jsQR(d.data, d.width, d.height);
        if (q && q.data && (q.data !== P.lastQr || now - P.lastAt > 2500)){ P.lastQr = q.data; P.lastAt = now; onScan(q.data); }
      }
      S.raf = requestAnimationFrame(tick);
    })();
  }).catch(function(){
    msg(m, 'Kamera tidak bisa dibuka. Izinkan akses kamera untuk situs ini di pengaturan browser, lalu coba lagi.', 'err');
  });
}
function stopCam(){
  if (S.raf) cancelAnimationFrame(S.raf); S.raf = 0;

  var v = $('vid'); if (v) v.classList.add('hide');
  if ($('bCam')) $('bCam').textContent = 'Buka Kamera';
}

function onScan(text){
  var k = keyOf(text), m = $('scanMsg'), pt = P.points.filter(function(p){ return p.key === k; })[0];
  if (!pt) return msg(m, 'QR tidak dikenali: "' + String(text).slice(0, 50) + '"', 'err');
  if (P.sent[k]) return msg(m, pt.nama + ' sudah terkirim.', 'info');
  if (P.done[k]) return msg(m, pt.nama + ' sudah di-scan.', 'info');
  var it = { nama: pt.nama, time: Date.now(), note: '', photo: null, thumb: null, lat: '', lng: '' };
  P.done[k] = it; if (!P.started) P.started = it.time;
  if (navigator.vibrate) navigator.vibrate(80);
  if (navigator.geolocation) navigator.geolocation.getCurrentPosition(function(p){ it.lat = p.coords.latitude; it.lng = p.coords.longitude; }, function(){}, { timeout: 8000, maximumAge: 60000 });

/* ---------- Export PDF (dibuat di browser dengan jsPDF) ---------- */
function pdfClean(s){
  return String(s == null ? '' : s)
    .replace(/[–—−]/g, '-').replace(/[‘’]/g, "'").replace(/[“”]/g, '"')
    .replace(/[•●]/g, '-').replace(/…/g, '...').replace(/\r/g, '')
    .replace(/[^\x20-\xFF\n]/g, '?');
}
function pad2(n){ return ('0' + n).slice(-2); }
function fmtTgl(dt){ return dt.getDate() + ' ' + ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'][dt.getMonth()] + ' ' + dt.getFullYear(); }

function buildPdf(d){
  var J = window.jspdf && window.jspdf.jsPDF;
  if (!J) throw new Error('Pustaka PDF belum termuat. Periksa koneksi internet lalu muat ulang halaman.');
  var doc = new J({ unit: 'mm', format: 'a4' }), W = 210, H = 297, M = 14, CW = W - 2 * M, y = 0;
  function need(h){ if (y + h > H - 16){ doc.addPage(); y = M; } }
  function txt(s, x, yy, o){ doc.text(pdfClean(s), x, yy, o); }
  function heading(s){ need(14); y += 4; doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(23, 48, 79); txt(s, M, y); y += 2; doc.setDrawColor(210); doc.line(M, y, W - M, y); y += 5; }

  var now = new Date(), start = new Date(); start.setDate(start.getDate() - (d.days - 1));
  doc.setFillColor(23, 48, 79); doc.rect(0, 0, W, 24, 'F');
  doc.setTextColor(255); doc.setFont('helvetica', 'bold'); doc.setFontSize(16); txt('FB Cek Floor - Laporan Patroli', M, 11);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
  txt('Periode: ' + fmtTgl(start) + ' - ' + fmtTgl(now) + ' (' + d.days + ' hari)', M, 18);
  y = 31; doc.setTextColor(90); doc.setFontSize(8.5);
  txt('Dibuat ' + fmtTgl(now) + ' ' + pad2(now.getHours()) + '.' + pad2(now.getMinutes()) + (S.me ? ' oleh ' + S.me.nama : ''), M, y); y += 6;

  var k = d.kpi, boxes = [['Laporan hari ini', k.today], ['Titik dicek hari ini', k.locChecked + '/' + k.locTotal], ['Belum dicek hari ini', k.locTotal - k.locChecked], ['Laporan ' + d.days + ' hari', k.period]];
  var bw = (CW - 3 * 4) / 4;
  boxes.forEach(function(b, i){
    var x = M + i * (bw + 4);
    doc.setFillColor(243, 244, 246); doc.roundedRect(x, y, bw, 17, 2, 2, 'F');
    doc.setTextColor(100); doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); txt(b[0], x + 3, y + 5.5);
    doc.setTextColor(20); doc.setFont('helvetica', 'bold'); doc.setFontSize(15); txt(b[1], x + 3, y + 13.5);
  });
  y += 21;

  heading('Status titik hari ini (' + k.locChecked + '/' + k.locTotal + ' sudah dicek)');
  if (!d.locStatus.length){ doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(120); txt('Belum ada lokasi aktif.', M, y); y += 6; }
  groupBy(d.locStatus).forEach(function(g){
    var okN = g.items.filter(function(i){ return i.x.count > 0; }).length;
    need(16); doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5); doc.setTextColor(30); txt(g.group + '  (' + okN + '/' + g.items.length + ')', M, y); y += 5;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5);
    var cols = 3, cw = CW / cols;
    function fit(str, maxW){
      str = pdfClean(str); if (doc.getTextWidth(str) <= maxW) return str;
      while (str.length > 1 && doc.getTextWidth(str + '..') > maxW) str = str.slice(0, -1);
      return str + '..';
    }
    for (var i = 0; i < g.items.length; i += cols){
      need(6);
      for (var c = 0; c < cols; c++){
        var it = g.items[i + c]; if (!it) continue;
        var x = M + c * cw, l = it.x, right = x + cw - 3;
        if (l.count){ doc.setFillColor(31, 138, 91); doc.circle(x + 1.5, y - 1.2, 1.2, 'F'); } else { doc.setDrawColor(160); doc.circle(x + 1.5, y - 1.2, 1.2, 'S'); }
        var st = l.count ? fit(l.waktu + ' ' + String(l.petugas || '').split(' ')[0], 31) : 'belum';
        doc.setTextColor(l.count ? 31 : 140, l.count ? 138 : 140, l.count ? 91 : 140);
        txt(st, right, y, { align: 'right' });
        var stW = doc.getTextWidth(pdfClean(st));
        doc.setTextColor(30); txt(fit(it.label, cw - 5 - stW - 4), x + 5, y);
      }
      y += 5.5;
    }
    y += 2;
  });

  heading('Laporan terbaru (' + d.recent.length + ')');
  if (!d.recent.length){ doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(120); txt('Belum ada laporan.', M, y); y += 6; }
  var rc = 3, rw = CW / rc, tw = rw - 19 - 3; // lebar kolom, lebar teks di samping foto
  function rlines(s, size, bold, maxLines){
    doc.setFont('helvetica', bold ? 'bold' : 'normal'); doc.setFontSize(size);
    var L = doc.splitTextToSize(pdfClean(s), tw);
    if (maxLines && L.length > maxLines){ L = L.slice(0, maxLines); var t = L[maxLines - 1]; while (t.length > 1 && doc.getTextWidth(t + '..') > tw) t = t.slice(0, -1); L[maxLines - 1] = t + '..'; }
    return L;
  }
  groupBy(d.recent.map(function(r){ return { nama: r.lokasi, r: r }; })).forEach(function(g){
    need(34); doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5); doc.setTextColor(30);
    txt(g.group + '  (' + g.items.length + ' laporan)', M, y); y += 4;
    for (var i = 0; i < g.items.length; i += rc){
      var cards = [], rowH = 18;
      for (var c = 0; c < rc; c++){
        var it = g.items[i + c]; if (!it) continue;
        var r = it.x.r, card = { r: r, label: rlines(it.label, 9, true, 2), meta: rlines(r.waktu + ' - ' + r.petugas, 7.5, false, 2), note: r.catatan ? rlines(r.catatan, 8, false, 4) : [] };
        card.h = card.label.length * 4 + card.meta.length * 3.4 + card.note.length * 3.5 + 4;
        rowH = Math.max(rowH, card.h + 2); cards.push(card);
      }
      var pgBefore = doc.getNumberOfPages();
      need(rowH + 2 + (i > 0 ? 6 : 0));
      if (i > 0 && doc.getNumberOfPages() > pgBefore){
        doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5); doc.setTextColor(30); txt(g.group + '  (lanjutan)', M, y); y += 4;
      }
      cards.forEach(function(cd, c){
        var x = M + c * rw, r = cd.r, ty = y + 3;
        if (r.thumb){ try { doc.addImage(r.thumb, 'JPEG', x, y, 16, 16); } catch (e) { doc.setFillColor(235); doc.rect(x, y, 16, 16, 'F'); } }
        else { doc.setFillColor(235); doc.rect(x, y, 16, 16, 'F'); }
        doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor(25); doc.text(cd.label, x + 19, ty);
        ty += cd.label.length * 4;
        doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(110); doc.text(cd.meta, x + 19, ty);
        ty += cd.meta.length * 3.4 + 0.6;
        if (cd.note.length){ doc.setFontSize(8); doc.setTextColor(50); doc.text(cd.note, x + 19, ty); }
      });
      y += rowH; doc.setDrawColor(235); doc.line(M, y - 1.5, W - M, y - 1.5); y += 2.5;
    }
    y += 2;
  });

  var pages = doc.getNumberOfPages();
  for (var p = 1; p <= pages; p++){
    doc.setPage(p); doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(150);
    txt('FB Cek Floor  -  hal. ' + p + ' / ' + pages, W / 2, H - 8, { align: 'center' });
  }
  return doc;
}

function exportPdf(){
  var m = $('pdfMsg'), b = $('pdf');
  if (!S.dash) return msg(m, 'Data dashboard belum dimuat.', 'err');
  b.disabled = true; b.textContent = 'Membuat PDF…'; msg(m, '');
  setTimeout(function(){
    try {
      var t = new Date(), doc = buildPdf(S.dash);
      doc.save('Laporan-Patroli-' + t.getFullYear() + pad2(t.getMonth() + 1) + pad2(t.getDate()) + '.pdf');
      msg(m, 'PDF dibuat. Cek folder Unduhan.', 'good');
    } catch (e) { msg(m, 'Gagal membuat PDF: ' + e.message, 'err'); }
    b.disabled = false; b.textContent = 'Export PDF';
  }, 30);
}

/* ---------- Karakter petugas berjalan (orisinal) + kartu "Sedang patroli" ---------- */

    '<g class="leg l2" ' + o(17, 28) + '><rect x="14.2" y="27" width="5.2" height="13" rx="2.4" fill="#1f3350"/><rect x="13.2" y="38.6" width="7.6" height="3.8" rx="1.9" fill="#111118"/></g>' +
    '<circle cx="17" cy="9" r="6.2" fill="#f0c49c"/><path d="M10.4 8.4 Q17 -0.8 23.6 8.4 Z" fill="#17304f"/><rect x="9.6" y="7.4" width="16.4" height="2.2" rx="1.1" fill="#17304f"/><circle cx="17" cy="3.4" r="1.1" fill="#e3b341"/>' +
    '<circle cx="20.4" cy="10" r="0.95" fill="#222"/><path d="M19 12.6 q1.6 1 3 0" stroke="#a5654a" stroke-width=".8" fill="none" stroke-linecap="round"/>' +
    '<g class="arm a2" ' + o(17, 17) + '><rect x="14.6" y="16" width="4.6" height="12" rx="2.3" fill="#2f4b73"/><circle cx="17" cy="28.6" r="2.4" fill="#f0c49c"/><rect x="16" y="26.6" width="9" height="4" rx="1.6" fill="#555a63"/><rect x="24" y="26.2" width="2.6" height="4.8" rx="1" fill="#e8d36a"/></g>' +
    '</g></svg>';
}
function leftFor(n, total){ var p = total ? Math.min(1, n / total) : 0; return 'calc((100% - 34px) * ' + p + ')'; }
function laneHtml(p){
  return '<div class="lane" data-u="' + esc(p.username) + '"><div class="lmeta"><b>' + esc(p.nama) + '</b><span>' + p.n + ' / ' + p.total + ' titik · mulai ' + esc(p.jam) + '</span></div>' +
    '<div class="track"><div class="wkr" style="left:' + leftFor(p.n, p.total) + '">' + walkerSvg() + '</div><span class="flag">🏁</span></div></div>';
}
function stopLive(){ if (DL.timer) clearInterval(DL.timer); DL.timer = 0; }
function refreshLive(){
  if (!$('liveBox')) return stopLive();
  call('getActivePatrols').then(function(list){
    var box = $('liveBox'); if (!box) return;
    var keep = {};
    list.forEach(function(p){
      keep[p.username] = 1;
      var ln = box.querySelector('.lane[data-u="' + p.username + '"]');
      if (!ln) box.insertAdjacentHTML('beforeend', laneHtml(p));
      else { ln.querySelector('.lmeta span').textContent = p.n + ' / ' + p.total + ' titik · mulai ' + p.jam; ln.querySelector('.wkr').style.left = leftFor(p.n, p.total); }
    });
    Array.prototype.forEach.call(box.querySelectorAll('.lane'), function(ln){ if (!keep[ln.getAttribute('data-u')]) ln.remove(); });
    var empty = box.querySelector('.empty');
    if (list.length){ if (empty) empty.remove(); }
    else if (empty) empty.textContent = 'Tidak ada petugas yang sedang patroli.';
    else box.insertAdjacentHTML('beforeend', '<p class="empty" style="color:var(--mute);margin:0">Tidak ada petugas yang sedang patroli.</p>');
    $('liveN').textContent = list.length;
    $('liveN').className = 'pill ' + (list.length ? 'ok' : 'none');
  }).catch(function(){});
}
function startLive(){ stopLive(); refreshLive(); DL.timer = setInterval(refreshLive, 15000); }

/* sinyal "sedang patroli" dari HP petugas */
function pingNow(){
  if (!S.token || !S.me) return;
  var n = Object.keys(P.done).length + Object.keys(P.sent).length; if (!n) return;
  call('patrolPing', { n: n, total: P.points.length }).catch(function(){});
}
function startPing(){ if (!PG.timer) PG.timer = setInterval(pingNow, 45000); }
function stopPing(){ if (PG.timer) clearInterval(PG.timer); PG.timer = 0; }

function dashTiles(list){
  if (!list.length) return '<p style="color:var(--mute)">Belum ada lokasi aktif.</p>';
  return groupBy(list).map(function(g){
    var okN = g.items.filter(function(i){ return i.x.count > 0; }).length;
    return '<div class="grp">' + esc(g.group) + '<span>' + okN + '/' + g.items.length + '</span></div><div class="tiles">' +
      g.items.map(function(i){
        var l = i.x;
        return l.count ? '<div class="pt" style="background:#e6f4ec;color:#1f7a50;border:1px solid #bfe3cf"><b>✓ ' + esc(i.label) + '</b><small>' + esc(l.waktu) + ' · ' + esc(l.petugas) + (l.count > 1 ? ' · ' + l.count + 'x' : '') + '</small></div>'
          : '<div class="pt todo"><b style="font-weight:600">' + esc(i.label) + '</b><small>belum</small></div>';
      }).join('') + '</div>';
  }).join('');
}

function renderDash(){
  var d = S.dash, k = d.kpi;
  $('main').innerHTML =
    '<div class="row noprint" style="margin-bottom:10px"><select id="days">' +
    [7, 14, 30].map(function(n){ return '<option value="' + n + '"' + (n === d.days ? ' selected' : '') + '>' + n + ' hari terakhir</option>'; }).join('') +
    '</select><button class="btn sec" id="rf">Refresh</button><button class="btn" id="pdf">Export PDF</button></div><div id="pdfMsg"></div>' +
    '<div class="kpis">' +
      '<div class="kpi"><span>Laporan hari ini</span><b>' + k.today + '</b></div>' +
      '<div class="kpi"><span>Lokasi sudah dicek hari ini</span><b>' + k.locChecked + '/' + k.locTotal + '</b></div>' +
      '<div class="kpi"><span>Belum dicek hari ini</span><b>' + (k.locTotal - k.locChecked) + '</b></div>' +
      '<div class="kpi"><span>Laporan ' + d.days + ' hari</span><b>' + k.period + '</b></div></div>' +
    '<div class="card"><h2>Sedang patroli <span class="pill none" id="liveN">0</span></h2><div id="liveBox"><p class="empty" style="color:var(--mute);margin:0">Memuat…</p></div></div>' +
    '<div class="card"><h2>Status titik hari ini</h2>' + dashTiles(d.locStatus) + '</div>' +
    '<div class="card"><h2>Laporan terbaru</h2><table>' +
      (d.recent.length ? d.recent.map(function(r){ return '<tr><td style="width:64px">' + (r.thumb ? '<img class="thumb" style="cursor:pointer" data-p="' + esc(r.foto_id) + '" src="' + esc(r.thumb) + '">' : '') + '</td><td>' + esc(r.lokasi) + '<br><small style="color:var(--mute)">' + esc(r.waktu) + ' · ' + esc(r.petugas) + '</small>' + (r.catatan ? '<br><small>' + esc(r.catatan) + '</small>' : '') + '</td></tr>'; }).join('') : '<tr><td style="color:var(--mute)">Belum ada laporan.</td></tr>') +
    '</table></div>';
  $('days').onchange = function(){ S.days = +this.value; viewDash(); };
  $('rf').onclick = viewDash;
  $('pdf').onclick = exportPdf;
  startLive();
  $('main').onclick = function(e){ var id = e.target.getAttribute && e.target.getAttribute('data-p'); if (id) openPhoto(id); };
}

function openPhoto(id){
  var m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = '<div class="card"><p id="pl">Memuat foto…</p><img id="pi" class="prev hide" style="max-height:70vh"><button class="btn sec block" style="margin-top:10px" id="pc">Tutup</button></div>';
  document.body.appendChild(m); m.querySelector('#pc').onclick = function(){ m.remove(); };
  call('getPhoto', id).then(function(src){ m.querySelector('#pl').remove(); var i = m.querySelector('#pi'); i.src = src; i.classList.remove('hide'); })
    .catch(function(e){ m.querySelector('#pl').textContent = e.message; });
}

/* ---------- Admin: Lokasi ---------- */
function loadAdmin(){ return call('adminList').then(function(a){ S.admin = a; }); }

function viewLoc(){
  $('main').innerHTML = '<div class="card">Memuat…</div>';
  loadAdmin().then(renderLoc).catch(function(e){ $('main').innerHTML = '<div class="card"><div class="msg err">' + esc(e.message) + '</div></div>'; });
}
function renderLoc(){
  var locs = S.admin.locations;
  $('main').innerHTML =
    '<div class="card"><h2>Tambah lokasi</h2><input id="ln" placeholder="Nama lokasi, mis. Lantai 30 Gatsu Barat" maxlength="60">' +
    '<button class="btn" style="margin-top:10px" id="addL">Tambah</button><div id="lm"></div>' +
    '<p style="color:var(--mute);font-size:13px;margin:8px 0 0">QR berisi nama lokasi saja, jadi nama harus sama persis dengan teks di QR yang dicetak.</p></div>' +
    '<div class="card"><h2>Daftar lokasi (' + locs.length + ')</h2><table><tr><th>Lokasi</th><th>Status</th><th></th></tr>' +
    locs.map(function(l, i){
      return '<tr><td>' + esc(l.nama) + '</td>' +
        '<td><span class="pill ' + (l.aktif === 'YES' ? 'ok' : 'none') + '">' + (l.aktif === 'YES' ? 'Aktif' : 'Nonaktif') + '</span></td>' +
        '<td style="white-space:nowrap"><button class="btn sm" data-a="qr" data-i="' + i + '">QR</button> ' +
        '<button class="btn sm sec" data-a="tg" data-i="' + i + '">' + (l.aktif === 'YES' ? 'Nonaktifkan' : 'Aktifkan') + '</button></td></tr>';
    }).join('') + '</table></div>';
  $('addL').onclick = function(){
    call('adminAddLocation', $('ln').value).then(function(a){ S.admin = a; renderLoc(); })
      .catch(function(e){ msg($('lm'), e.message); });
  };
  $('main').onclick = function(e){
    var a = e.target.getAttribute('data-a'), i = e.target.getAttribute('data-i'); if (!a) return;
    var l = locs[+i];
    if (a === 'qr') return showQr(l);
    call('adminSetLocationActive', l.nama, l.aktif === 'YES' ? 'NO' : 'YES')
      .then(function(r){ S.admin = r; renderLoc(); }).catch(function(er){ alert(er.message); });
  };
}
function showQr(l){
  qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];
  var q = qrcode(0, 'M'); q.addData(l.nama); q.make();
  var m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = '<div class="card">' +
    '<div class="qrbox">' + q.createSvgTag(6, 2) + '</div><div style="font-size:22px;font-weight:600;margin:6px 0 12px">' + esc(l.nama) + '</div>' +
    '<div class="row noprint"><button class="btn" id="pr">Cetak</button><button class="btn sec" id="cl">Tutup</button></div></div>';
  document.body.appendChild(m);
  m.querySelector('#cl').onclick = function(){ m.remove(); };
  m.querySelector('#pr').onclick = function(){ window.print(); };
}

/* ---------- Admin: User ---------- */
function viewUsr(){
  $('main').innerHTML = '<div class="card">Memuat…</div>';
  loadAdmin().then(renderUsr).catch(function(e){ $('main').innerHTML = '<div class="card"><div class="msg err">' + esc(e.message) + '</div></div>'; });
}
function renderUsr(){
  badge();
  var all = S.admin.users, pend = all.filter(function(u){ return u.aktif === 'PENDING'; }), rest = all.filter(function(u){ return u.aktif !== 'PENDING'; });
  var roleOpts = ['petugas', 'supervisor', 'admin'].map(function(r){ return '<option>' + r + '</option>'; }).join('');
  var pill = { YES: ['ok', 'Aktif'], NO: ['none', 'Nonaktif'], REJECTED: ['bad', 'Ditolak'] };
  $('main').innerHTML =
    (pend.length ? '<div class="card" style="border-color:var(--warn)"><h2>Menunggu persetujuan (' + pend.length + ')</h2><table>' +
      pend.map(function(u){
        return '<tr><td>' + esc(u.nama) + '<br><small style="color:var(--mute)">' + esc(u.username) + '</small></td>' +
          '<td><select id="pr_' + esc(u.username) + '">' + roleOpts + '</select></td>' +
          '<td style="white-space:nowrap"><button class="btn sm" data-a="ok" data-u="' + esc(u.username) + '">Setujui</button> ' +
          '<button class="btn sm sec" data-a="no" data-u="' + esc(u.username) + '">Tolak</button></td></tr>';
      }).join('') + '</table></div>' : '') +
    '<div class="card"><h2>Tambah / ubah user</h2>' +
    '<div class="row"><input id="uu" placeholder="ID user (mis. budi01)" autocapitalize="none"><input id="un" placeholder="Nama"></div>' +
    '<div class="row" style="margin-top:8px"><select id="ur">' + roleOpts + '</select><input id="up" inputmode="numeric" maxlength="6" placeholder="PIN 6 digit"></div>' +
    '<button class="btn" style="margin-top:10px" id="addU">Simpan</button><div id="um"></div>' +
    '<p style="color:var(--mute);font-size:13px;margin:8px 0 0">ID user yang sudah ada = ubah data / reset PIN. Kosongkan PIN untuk tidak mengubahnya.</p></div>' +
    '<div class="card"><h2>Daftar user</h2><table><tr><th>User</th><th>Role</th><th>Status</th><th></th></tr>' +
    rest.map(function(u){
      var p = pill[u.aktif] || ['none', esc(u.aktif)];
      return '<tr><td>' + esc(u.nama) + '<br><small style="color:var(--mute)">' + esc(u.username) + '</small></td><td>' + esc(u.role) + '</td>' +
        '<td><span class="pill ' + p[0] + '">' + p[1] + '</span></td>' +
        '<td style="white-space:nowrap"><button class="btn sm" data-a="edit" data-u="' + esc(u.username) + '">Ubah</button> <button class="btn sm sec" data-a="pin" data-u="' + esc(u.username) + '">Ubah PIN</button> ' +
        '<button class="btn sm sec" data-a="tg" data-u="' + esc(u.username) + '">' + (u.aktif === 'YES' ? 'Cabut akses' : 'Aktifkan') + '</button></td></tr>';
    }).join('') + '</table></div>';
  $('addU').onclick = function(){
    var uname = $('uu').value.trim().toLowerCase(), ex = all.filter(function(x){ return x.username === uname; })[0];
    call('adminSaveUser', { username: $('uu').value, nama: $('un').value, role: $('ur').value, pin: $('up').value, aktif: ex && ex.aktif === 'NO' ? 'NO' : 'YES' })
      .then(function(a){ S.admin = a; renderUsr(); }).catch(function(e){ msg($('um'), e.message); });
  };
  $('main').onclick = function(e){
    var a = e.target.getAttribute('data-a'), un = e.target.getAttribute('data-u'); if (!a) return;
    var u = all.filter(function(x){ return x.username === un; })[0], req;
    if (a === 'edit'){
      $('uu').value = u.username; $('un').value = u.nama; $('ur').value = u.role; $('up').value = '';
      $('um').innerHTML = '<div class="msg info">Mengubah ' + esc(u.username) + '. Ubah nama / role lalu tekan Simpan. Kosongkan PIN jika tidak ingin mengganti PIN.</div>';
      $('un').scrollIntoView({ behavior: 'smooth', block: 'center' }); return $('un').focus();
    }
    if (a === 'ok' || a === 'no'){
      req = call('adminApproveUser', un, a === 'ok' ? $('pr_' + un).value : '', a === 'ok');
    } else {
      var p = { username: u.username, nama: u.nama, role: u.role, aktif: u.aktif };
      if (a === 'pin'){ var np = prompt('PIN baru untuk ' + u.username + ' (6 digit):'); if (!np) return; p.pin = np; }
      else p.aktif = u.aktif === 'YES' ? 'NO' : 'YES';
      req = call('adminSaveUser', p);
    }
    req.then(function(r){ S.admin = r; renderUsr(); }).catch(function(er){ alert(er.message); });
  };
}

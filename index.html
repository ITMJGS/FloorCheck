<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FB Cek Floor</title>
<style>
  :root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1b;--mute:#6b6a65;--line:#e4e2dc;--acc:#0f6b4f;--accbg:#e3f1ec;--bad:#b3261e;--badbg:#fbe7e5;--warn:#9a6700;--warnbg:#fff3d6}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  header{background:var(--ink);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  header b{font-size:16px} header small{opacity:.7;display:block;font-size:12px}
  nav{display:flex;gap:4px;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:0;z-index:5}
  nav button{border:0;background:none;padding:8px 14px;border-radius:8px;font:inherit;color:var(--mute);white-space:nowrap;cursor:pointer}
  nav button.on{background:var(--accbg);color:var(--acc);font-weight:600}
  main{max-width:960px;margin:0 auto;padding:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
  h2{font-size:16px;margin:0 0 10px} h3{font-size:14px;margin:14px 0 8px;color:var(--mute)}
  button.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:12px 16px;font:inherit;font-weight:600;cursor:pointer}
  button.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
  button.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
  button.btn:disabled{opacity:.5}
  .block{display:block;width:100%}
  input,select,textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff}
  label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
  .row{display:flex;gap:8px;flex-wrap:wrap} .row>*{flex:1;min-width:120px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
  .kpi span{display:block;font-size:12px;color:var(--mute)} .kpi b{font-size:26px}
  .pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
  .ok{background:var(--accbg);color:var(--acc)} .bad{background:var(--badbg);color:var(--bad)} .warn{background:var(--warnbg);color:var(--warn)} .none{background:#eee;color:var(--mute)}
  table{width:100%;border-collapse:collapse;font-size:14px} td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
  th{font-size:12px;color:var(--mute);font-weight:600}
  .bars{display:flex;align-items:flex-end;gap:4px;height:110px;padding-top:6px}
  .bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:10px;color:var(--mute)}
  .bars i{display:block;width:100%;background:var(--acc);border-radius:4px 4px 0 0;min-height:2px}
  .chk{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .tog{display:flex;gap:6px} .tog button{border:1px solid var(--line);background:#fff;padding:6px 12px;border-radius:8px;font:inherit;cursor:pointer}
  .tog button.y.on{background:var(--accbg);color:var(--acc);border-color:var(--acc)} .tog button.n.on{background:var(--badbg);color:var(--bad);border-color:var(--bad)}
  video{width:100%;border-radius:10px;background:#000;max-height:60vh}
  .thumb{width:56px;height:56px;border-radius:8px;object-fit:cover;background:#eee}
  .prev{width:100%;max-height:260px;object-fit:cover;border-radius:10px;margin-top:8px}
  .msg{padding:10px 12px;border-radius:8px;margin:10px 0;font-size:14px}
  .msg.err{background:var(--badbg);color:var(--bad)} .msg.good{background:var(--accbg);color:var(--acc)} .msg.info{background:var(--warnbg);color:var(--warn)}
  .hide{display:none!important}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
  .modal .card{max-width:360px;width:100%;text-align:center;margin:0}
  .qrbox svg{width:100%;height:auto;max-width:260px}
  @media print{header,nav,.noprint{display:none!important} .modal{position:static;background:none} body{background:#fff}}
</style>
</head>
<body>
<header><div><b id="appName">FB Cek Floor</b><small id="who"></small></div><button class="btn sm sec hide" id="out">Keluar</button></header>
<nav id="nav" class="hide"></nav>
<main id="main"><div class="card">Memuat…</div></main>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script>
var S = { token: null, me: null, tab: 'scan', admin: null, dash: null, days: 7, stream: null, raf: 0 };

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
// Jika halaman ini dihosting di GitHub Pages / hosting lain, isi dengan URL web app Apps Script (berakhiran /exec).
// Jika dibuka langsung dari URL Apps Script, biarkan saja.
var API_URL = 'https://script.google.com/macros/s/AKfycbxtBRdo7cPj3y3PrAYwrKER2RYZfdkPLl8rDeGgJ-Ezgvqw_P_fnJHbgxNibn_ca6B9Dw/exec';

function transport(fn, args){
  if (window.google && google.script && google.script.run){
    return new Promise(function(res, rej){
      var r = google.script.run.withSuccessHandler(res).withFailureHandler(function(e){
        rej(new Error(e && e.message ? e.message.replace(/^Error:\s*/, '') : String(e)));
      });
      r[fn].apply(r, args);
    });
  }
  if (!/^https:\/\/script\.google\.com\//.test(API_URL))
    return Promise.reject(new Error('API_URL di Index.html belum diisi dengan URL web app (/exec).'));
  return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }) })
    .catch(function(){ throw new Error('Tidak bisa terhubung ke server. Periksa internet dan URL /exec.'); })
    .then(function(r){ return r.json().catch(function(){ throw new Error('Respons server tidak valid. Pastikan deployment aksesnya "Anyone" dan URL-nya benar (/exec).'); }); })
    .then(function(j){ if (!j.ok) throw new Error(j.error || 'Terjadi kesalahan.'); return j.data; });
}

function call(fn){
  var args = Array.prototype.slice.call(arguments, 1);
  if (fn !== 'login' && fn !== 'register') args.unshift(S.token);
  return transport(fn, args).catch(function(e){
    if (e.message.indexOf('SESI_HABIS') >= 0){ showLogin('Sesi berakhir, silakan login lagi.'); throw new Error('Sesi berakhir.'); }
    throw e;
  });
}
function saveTok(t){ try { if (t) sessionStorage.setItem('fbcf_t', t); else sessionStorage.removeItem('fbcf_t'); } catch (e) {} }
function msg(el, text, type){ el.innerHTML = text ? '<div class="msg ' + (type || 'err') + '">' + esc(text) + '</div>' : ''; }

/* ---------- Login & Boot ---------- */
function showLogin(note){
  stopCam(); S.token = null; S.me = null; saveTok(null);
  $('nav').classList.add('hide'); $('out').classList.add('hide'); $('who').textContent = '';
  $('main').innerHTML = '<div class="card" style="max-width:380px;margin:30px auto"><h2>Masuk</h2>' +
    '<label>ID user</label><input id="lu" autocapitalize="none" autocomplete="username">' +
    '<label>PIN (6 digit)</label><input id="lp" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password">' +
    '<button class="btn block" style="margin-top:14px" id="lb">Masuk</button><button class="btn sec block" style="margin-top:8px" id="lr">Belum punya akun? Daftar</button><div id="lmsg">' + (note ? '<div class="msg info">' + esc(note) + '</div>' : '') + '</div></div>';
  function doLogin(){
    var b = $('lb'); b.disabled = true; b.textContent = 'Memeriksa…'; msg($('lmsg'), '');
    call('login', $('lu').value, $('lp').value).then(function(r){ S.token = r.token; saveTok(r.token); start(r); })
      .catch(function(e){ b.disabled = false; b.textContent = 'Masuk'; $('lp').value = ''; msg($('lmsg'), e.message); });
  }
  $('lb').onclick = doLogin;
  $('lr').onclick = function(){ showRegister(); };
  $('lp').onkeydown = function(e){ if (e.key === 'Enter') doLogin(); };
}

function showRegister(){
  $('main').innerHTML = '<div class="card" style="max-width:380px;margin:30px auto"><h2>Daftar akun</h2>' +
    '<label>Nama lengkap</label><input id="rn" maxlength="40">' +
    '<label>ID user (hanya huruf & angka, 3-20 karakter)</label><input id="ru" autocapitalize="none" maxlength="20">' +
    '<label>PIN (6 digit angka)</label><input id="rp" type="password" inputmode="numeric" maxlength="6">' +
    '<label>Ulangi PIN</label><input id="rp2" type="password" inputmode="numeric" maxlength="6">' +
    '<button class="btn block" style="margin-top:14px" id="rb">Kirim pendaftaran</button>' +
    '<button class="btn sec block" style="margin-top:8px" id="rx">Kembali ke login</button><div id="rmsg"></div></div>';
  $('rx').onclick = function(){ showLogin(); };
  $('rb').onclick = function(){
    var m = $('rmsg');
    if ($('rp').value !== $('rp2').value) return msg(m, 'PIN dan ulangi PIN tidak sama.');
    var b = $('rb'); b.disabled = true; b.textContent = 'Mengirim…'; msg(m, '');
    call('register', $('ru').value, $('rn').value, $('rp').value).then(function(){
      $('main').innerHTML = '<div class="card" style="max-width:380px;margin:30px auto"><h2>Pendaftaran terkirim ✔</h2>' +
        '<p>Akun Anda menunggu persetujuan admin. Setelah disetujui, login dengan ID dan PIN yang tadi Anda buat.</p>' +
        '<button class="btn block" id="bk">Ke halaman login</button></div>';
      $('bk').onclick = function(){ showLogin(); };
    }).catch(function(e){ b.disabled = false; b.textContent = 'Kirim pendaftaran'; msg(m, e.message); });
  };
}

function start(r){
  S.me = r.user; $('appName').textContent = r.appName;
  $('who').textContent = r.user.nama + ' · ' + r.user.role; $('out').classList.remove('hide');
  $('out').onclick = function(){ call('logout').catch(function(){}).then(function(){ showLogin(); }); };
  var tabs = [['scan','Scan & Isi']];
  if (r.user.role !== 'petugas') tabs.push(['dash','Dashboard']);
  if (r.user.role === 'admin') tabs.push(['loc','Lokasi & QR'], ['usr','User']);
  $('nav').innerHTML = tabs.map(function(t){ return '<button data-t="' + t[0] + '">' + t[1] + '</button>'; }).join('');
  $('nav').classList.remove('hide');
  $('nav').onclick = function(e){ var t = e.target.getAttribute('data-t'); if (t) go(t); };
  go(r.user.role === 'petugas' ? 'scan' : 'dash');
  if (r.user.role === 'admin') call('adminList').then(function(a){ S.admin = a; badge(); }).catch(function(){});
}
function badge(){
  var n = (S.admin ? S.admin.users : []).filter(function(u){ return u.aktif === 'PENDING'; }).length, b = document.querySelector('#nav [data-t="usr"]');
  if (b) b.textContent = 'User' + (n ? ' (' + n + ' baru)' : '');
}

(function boot(){
  var t = null; try { t = sessionStorage.getItem('fbcf_t'); } catch (e) {}
  if (!t) return showLogin();
  S.token = t;
  call('getMe').then(function(r){ if (r.ok) start(r); else showLogin(); }).catch(function(){ showLogin(); });
})();

function go(t){
  stopCam(); S.tab = t; $('main').onclick = null;
  Array.prototype.forEach.call($('nav').children, function(b){ b.classList.toggle('on', b.getAttribute('data-t') === t); });
  ({ scan: viewScan, dash: viewDash, loc: viewLoc, usr: viewUsr })[t]();
}

/* ---------- Scan & Form ---------- */
var F = { token: null, photo: null, thumb: null, lat: '', lng: '' };

function viewScan(){
  F = { token: null, photo: null, thumb: null, lat: '', lng: '' };
  $('main').innerHTML =
    '<div class="card"><h2>1. Scan QR lokasi</h2>' +
    '<video id="vid" class="hide" playsinline muted></video><canvas id="cv" class="hide"></canvas>' +
    '<button class="btn block" style="margin-top:8px" id="bCam">Buka kamera & scan</button>' +
    '<div id="scanMsg"></div></div><div id="formBox"></div>';
  $('bCam').onclick = startCam;
}

function startCam(){
  var m = $('scanMsg');
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    return msg(m, 'Kamera tidak tersedia di browser ini. Buka aplikasi lewat Chrome/Safari dengan alamat https.', 'err');
  }
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }).then(function(st){
    S.stream = st; var v = $('vid'); v.srcObject = st; v.classList.remove('hide'); v.play(); msg(m, 'Arahkan kamera ke QR…', 'info');
    var c = $('cv'), ctx = c.getContext('2d');
    (function tick(){
      if (!S.stream) return;
      if (v.readyState === v.HAVE_ENOUGH_DATA){
        c.width = v.videoWidth; c.height = v.videoHeight; ctx.drawImage(v, 0, 0);
        var d = ctx.getImageData(0, 0, c.width, c.height), q = jsQR(d.data, d.width, d.height);
        if (q && q.data){ stopCam(); return onQr(q.data); }
      }
      S.raf = requestAnimationFrame(tick);
    })();
  }).catch(function(){
    msg(m, 'Kamera tidak bisa dibuka. Izinkan akses kamera untuk situs ini di pengaturan browser, lalu coba lagi.', 'err');
  });
}
function stopCam(){
  if (S.raf) cancelAnimationFrame(S.raf); S.raf = 0;
  if (S.stream){ S.stream.getTracks().forEach(function(t){ t.stop(); }); S.stream = null; }
  var v = $('vid'); if (v) v.classList.add('hide');
}

function loadImg(file, max){
  return new Promise(function(res, rej){
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function(){
      var k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c);
    };
    img.onerror = function(){ rej(new Error('Gambar tidak bisa dibaca')); }; img.src = url;
  });
}
function onQr(text){
  text = String(text || '').trim();
  msg($('scanMsg'), 'Memeriksa QR…', 'info');
  call('checkLocation', text).then(function(r){
    F.token = text; F.name = r.nama; msg($('scanMsg'), 'QR terbaca: ' + r.nama, 'good');
    if (navigator.geolocation) navigator.geolocation.getCurrentPosition(function(p){ F.lat = p.coords.latitude; F.lng = p.coords.longitude; }, function(){}, { timeout: 8000 });
    renderForm();
  }).catch(function(e){ msg($('scanMsg'), e.message + ' Isi QR: "' + text.slice(0, 60) + '"', 'err'); });
}

function renderForm(){
  $('formBox').innerHTML =
    '<div class="card"><h2>2. Checklist floor</h2><div class="msg good" style="margin-top:0">Lokasi: <b>' + esc(F.name) + '</b></div>' +
    '<label>Catatan (opsional)</label><textarea id="note" rows="3" maxlength="500"></textarea></div>' +
    '<div class="card"><h2>3. Foto lokasi</h2>' +
    '<button class="btn sec block" id="bPhoto">Ambil foto</button>' +
    '<input type="file" id="fPhoto" accept="image/*" capture="environment" class="hide">' +
    '<img id="prev" class="prev hide"></div>' +
    '<button class="btn block" id="bSend">Kirim laporan</button><div id="sendMsg"></div>';
  $('bPhoto').onclick = function(){ $('fPhoto').click(); };
  $('fPhoto').onchange = function(e){
    var f = e.target.files[0]; if (!f) return;
    Promise.all([loadImg(f, 1280), loadImg(f, 200)]).then(function(cs){ F.photo = cs[0].toDataURL('image/jpeg', 0.72); F.thumb = cs[1].toDataURL('image/jpeg', 0.6); var p = $('prev'); p.src = F.photo; p.classList.remove('hide'); })
      .catch(function(er){ msg($('sendMsg'), er.message, 'err'); });
  };
  $('bSend').onclick = send;
  $('formBox').scrollIntoView({ behavior: 'smooth' });
}

function send(){
  var m = $('sendMsg');
  if (!F.photo) return msg(m, 'Foto lokasi wajib diambil.', 'err');
  var b = $('bSend'); b.disabled = true; b.textContent = 'Mengirim…'; msg(m, '');
  call('submitCheck', { token: F.token, note: $('note').value, photo: F.photo, thumb: F.thumb, lat: F.lat, lng: F.lng })
    .then(function(r){
      $('main').innerHTML = '<div class="card"><h2>Laporan terkirim ✔</h2><p><b>' + esc(r.lokasi) + '</b></p>' +
        '<button class="btn block" id="again">Scan lokasi berikutnya</button></div>';
      $('again').onclick = viewScan;
    }).catch(function(e){ b.disabled = false; b.textContent = 'Kirim laporan'; msg(m, e.message, 'err'); });
}

/* ---------- Dashboard ---------- */
function viewDash(){
  $('main').innerHTML = '<div class="card">Memuat dashboard…</div>';
  call('getDashboard', S.days).then(function(d){ S.dash = d; renderDash(); })
    .catch(function(e){ $('main').innerHTML = '<div class="card"><div class="msg err">' + esc(e.message) + '</div></div>'; });
}
function renderDash(){
  var d = S.dash, k = d.kpi, max = Math.max.apply(null, d.trend.map(function(t){ return t.count; }).concat([1]));
  $('main').innerHTML =
    '<div class="row noprint" style="margin-bottom:10px"><select id="days">' +
    [7, 14, 30].map(function(n){ return '<option value="' + n + '"' + (n === d.days ? ' selected' : '') + '>' + n + ' hari terakhir</option>'; }).join('') +
    '</select><button class="btn sec" id="rf">Refresh</button></div>' +
    '<div class="kpis">' +
      '<div class="kpi"><span>Laporan hari ini</span><b>' + k.today + '</b></div>' +
      '<div class="kpi"><span>Lokasi sudah dicek hari ini</span><b>' + k.locChecked + '/' + k.locTotal + '</b></div>' +
      '<div class="kpi"><span>Belum dicek hari ini</span><b>' + (k.locTotal - k.locChecked) + '</b></div>' +
      '<div class="kpi"><span>Laporan ' + d.days + ' hari</span><b>' + k.period + '</b></div></div>' +
    '<div class="card"><h2>Jumlah laporan per hari</h2><div class="bars">' +
      d.trend.map(function(t){ return '<div title="' + t.count + ' laporan"><i style="height:' + Math.round(t.count / max * 80) + '%"></i>' + esc(t.tanggal) + '</div>'; }).join('') +
    '</div></div>' +
    '<div class="card"><h2>Status lokasi hari ini</h2><table><tr><th>Lokasi</th><th>Status</th><th>Terakhir oleh</th></tr>' +
      d.locStatus.map(function(l){ return '<tr><td>' + esc(l.nama) + '</td><td>' + (l.count ? '<span class="pill ok">Sudah (' + l.count + 'x)</span>' : '<span class="pill bad">Belum</span>') + '</td><td>' + (l.petugas ? esc(l.petugas) + '<br><small>' + l.waktu + '</small>' : '–') + '</td></tr>'; }).join('') +
    '</table></div>' +
    '<div class="card"><h2>Laporan terbaru</h2><table>' +
      (d.recent.length ? d.recent.map(function(r){ return '<tr><td style="width:64px">' + (r.thumb ? '<img class="thumb" style="cursor:pointer" data-p="' + esc(r.foto_id) + '" src="' + esc(r.thumb) + '">' : '') + '</td><td>' + esc(r.lokasi) + '<br><small style="color:var(--mute)">' + esc(r.waktu) + ' · ' + esc(r.petugas) + '</small>' + (r.catatan ? '<br><small>' + esc(r.catatan) + '</small>' : '') + '</td></tr>'; }).join('') : '<tr><td style="color:var(--mute)">Belum ada laporan.</td></tr>') +
    '</table></div>';
  $('days').onchange = function(){ S.days = +this.value; viewDash(); };
  $('rf').onclick = viewDash;
  $('main').onclick = function(e){ var id = e.target.getAttribute && e.target.getAttribute('data-p'); if (id) openPhoto(id); };
}

function openPhoto(id){
  var m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = '<div class="card"><p id="pl">Memuat foto…</p><img id="pi" class="prev hide" style="max-height:70vh"><button class="btn sec block" style="margin-top:10px" id="pc">Tutup</button></div>';
  document.body.appendChild(m); m.querySelector('#pc').onclick = function(){ m.remove(); };
  call('getPhoto', id).then(function(src){ m.querySelector('#pl').remove(); var i = m.querySelector('#pi'); i.src = src; i.classList.remove('hide'); })
    .catch(function(e){ m.querySelector('#pl').textContent = e.message; });
}

/* ---------- Admin: Lokasi ---------- */
function loadAdmin(){ return call('adminList').then(function(a){ S.admin = a; }); }

function viewLoc(){
  $('main').innerHTML = '<div class="card">Memuat…</div>';
  loadAdmin().then(renderLoc).catch(function(e){ $('main').innerHTML = '<div class="card"><div class="msg err">' + esc(e.message) + '</div></div>'; });
}
function renderLoc(){
  var locs = S.admin.locations;
  $('main').innerHTML =
    '<div class="card"><h2>Tambah lokasi</h2><input id="ln" placeholder="Nama lokasi, mis. Lantai 30 Gatsu Barat" maxlength="60">' +
    '<button class="btn" style="margin-top:10px" id="addL">Tambah</button><div id="lm"></div>' +
    '<p style="color:var(--mute);font-size:13px;margin:8px 0 0">QR berisi nama lokasi saja, jadi nama harus sama persis dengan teks di QR yang dicetak.</p></div>' +
    '<div class="card"><h2>Daftar lokasi (' + locs.length + ')</h2><table><tr><th>Lokasi</th><th>Status</th><th></th></tr>' +
    locs.map(function(l, i){
      return '<tr><td>' + esc(l.nama) + '</td>' +
        '<td><span class="pill ' + (l.aktif === 'YES' ? 'ok' : 'none') + '">' + (l.aktif === 'YES' ? 'Aktif' : 'Nonaktif') + '</span></td>' +
        '<td style="white-space:nowrap"><button class="btn sm" data-a="qr" data-i="' + i + '">QR</button> ' +
        '<button class="btn sm sec" data-a="tg" data-i="' + i + '">' + (l.aktif === 'YES' ? 'Nonaktifkan' : 'Aktifkan') + '</button></td></tr>';
    }).join('') + '</table></div>';
  $('addL').onclick = function(){
    call('adminAddLocation', $('ln').value).then(function(a){ S.admin = a; renderLoc(); })
      .catch(function(e){ msg($('lm'), e.message); });
  };
  $('main').onclick = function(e){
    var a = e.target.getAttribute('data-a'), i = e.target.getAttribute('data-i'); if (!a) return;
    var l = locs[+i];
    if (a === 'qr') return showQr(l);
    call('adminSetLocationActive', l.nama, l.aktif === 'YES' ? 'NO' : 'YES')
      .then(function(r){ S.admin = r; renderLoc(); }).catch(function(er){ alert(er.message); });
  };
}
function showQr(l){
  qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];
  var q = qrcode(0, 'M'); q.addData(l.nama); q.make();
  var m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = '<div class="card">' +
    '<div class="qrbox">' + q.createSvgTag(6, 2) + '</div><div style="font-size:22px;font-weight:600;margin:6px 0 12px">' + esc(l.nama) + '</div>' +
    '<div class="row noprint"><button class="btn" id="pr">Cetak</button><button class="btn sec" id="cl">Tutup</button></div></div>';
  document.body.appendChild(m);
  m.querySelector('#cl').onclick = function(){ m.remove(); };
  m.querySelector('#pr').onclick = function(){ window.print(); };
}

/* ---------- Admin: User ---------- */
function viewUsr(){
  $('main').innerHTML = '<div class="card">Memuat…</div>';
  loadAdmin().then(renderUsr).catch(function(e){ $('main').innerHTML = '<div class="card"><div class="msg err">' + esc(e.message) + '</div></div>'; });
}
function renderUsr(){
  badge();
  var all = S.admin.users, pend = all.filter(function(u){ return u.aktif === 'PENDING'; }), rest = all.filter(function(u){ return u.aktif !== 'PENDING'; });
  var roleOpts = ['petugas', 'supervisor', 'admin'].map(function(r){ return '<option>' + r + '</option>'; }).join('');
  var pill = { YES: ['ok', 'Aktif'], NO: ['none', 'Nonaktif'], REJECTED: ['bad', 'Ditolak'] };
  $('main').innerHTML =
    (pend.length ? '<div class="card" style="border-color:var(--warn)"><h2>Menunggu persetujuan (' + pend.length + ')</h2><table>' +
      pend.map(function(u){
        return '<tr><td>' + esc(u.nama) + '<br><small style="color:var(--mute)">' + esc(u.username) + '</small></td>' +
          '<td><select id="pr_' + esc(u.username) + '">' + roleOpts + '</select></td>' +
          '<td style="white-space:nowrap"><button class="btn sm" data-a="ok" data-u="' + esc(u.username) + '">Setujui</button> ' +
          '<button class="btn sm sec" data-a="no" data-u="' + esc(u.username) + '">Tolak</button></td></tr>';
      }).join('') + '</table></div>' : '') +
    '<div class="card"><h2>Tambah / ubah user</h2>' +
    '<div class="row"><input id="uu" placeholder="ID user (mis. budi01)" autocapitalize="none"><input id="un" placeholder="Nama"></div>' +
    '<div class="row" style="margin-top:8px"><select id="ur">' + roleOpts + '</select><input id="up" inputmode="numeric" maxlength="6" placeholder="PIN 6 digit"></div>' +
    '<button class="btn" style="margin-top:10px" id="addU">Simpan</button><div id="um"></div>' +
    '<p style="color:var(--mute);font-size:13px;margin:8px 0 0">ID user yang sudah ada = ubah data / reset PIN. Kosongkan PIN untuk tidak mengubahnya.</p></div>' +
    '<div class="card"><h2>Daftar user</h2><table><tr><th>User</th><th>Role</th><th>Status</th><th></th></tr>' +
    rest.map(function(u){
      var p = pill[u.aktif] || ['none', esc(u.aktif)];
      return '<tr><td>' + esc(u.nama) + '<br><small style="color:var(--mute)">' + esc(u.username) + '</small></td><td>' + esc(u.role) + '</td>' +
        '<td><span class="pill ' + p[0] + '">' + p[1] + '</span></td>' +
        '<td style="white-space:nowrap"><button class="btn sm sec" data-a="pin" data-u="' + esc(u.username) + '">Ubah PIN</button> ' +
        '<button class="btn sm sec" data-a="tg" data-u="' + esc(u.username) + '">' + (u.aktif === 'YES' ? 'Cabut akses' : 'Aktifkan') + '</button></td></tr>';
    }).join('') + '</table></div>';
  $('addU').onclick = function(){
    call('adminSaveUser', { username: $('uu').value, nama: $('un').value, role: $('ur').value, pin: $('up').value, aktif: 'YES' })
      .then(function(a){ S.admin = a; renderUsr(); }).catch(function(e){ msg($('um'), e.message); });
  };
  $('main').onclick = function(e){
    var a = e.target.getAttribute('data-a'), un = e.target.getAttribute('data-u'); if (!a) return;
    var u = all.filter(function(x){ return x.username === un; })[0], req;
    if (a === 'ok' || a === 'no'){
      req = call('adminApproveUser', un, a === 'ok' ? $('pr_' + un).value : '', a === 'ok');
    } else {
      var p = { username: u.username, nama: u.nama, role: u.role, aktif: u.aktif };
      if (a === 'pin'){ var np = prompt('PIN baru untuk ' + u.username + ' (6 digit):'); if (!np) return; p.pin = np; }
      else p.aktif = u.aktif === 'YES' ? 'NO' : 'YES';
      req = call('adminSaveUser', p);
    }
    req.then(function(r){ S.admin = r; renderUsr(); }).catch(function(er){ alert(er.message); });
  };
}
</script>
</body>
